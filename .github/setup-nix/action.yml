name: Setup Nix
description: Installs Nix, configures binary caches, and optionally builds/activates a development environment using direnv or a specific Nix devShell.

inputs:
  push-to-cache:
    description: Deprecated compatibility input; ignored. Use explicit Attic cache push steps instead.
    type: boolean
    required: false
    default: false
  trusted-public-keys:
    description: Trusted public keys
    required: false
    default: ''
  substituters:
    description: Substituters
    required: false
    default: ''
  attic-token:
    description: Attic token used to upload newly built store paths.
    required: false
    default: ''
  attic-cache:
    description: Attic cache name to upload newly built store paths to.
    required: false
    default: ''
  attic-endpoint:
    description: Attic server endpoint.
    required: false
    default: 'https://cache.metacraft-labs.com/'
  nix-github-token:
    description: GitHub token to add as access-token in nix.conf
    default: ''
    required: false
  nix-gitlab-token:
    description: GitLab token to add as access-token in nix.conf
    default: ''
    required: false
  nix-gitlab-domain:
    description: GitLab domain to add as access-token in nix.conf
    default: 'gitlab.com'
    required: false
  nix-version:
    description: Deprecated compatibility input; ignored by the Determinate Nix installer.
    default: ''
    required: false
  experimental-features:
    description: >-
      Space-separated experimental features to enable. The action writes these
      into nix.conf and then VERIFIES they are actually in effect, failing the
      job if they are not (see `verify-nix-config.sh`).
    required: false
    default: 'nix-command flakes pipe-operators'
  use-direnv:
    description: Whether to use direnv to load the environment
    type: boolean
    required: false
    default: false
  devshell:
    description: The name of the devShell to build and export to GITHUB_ENV (e.g. 'default' for .#devShells.default)
    required: false
    default: ''
  use-nix-cache:
    description: Whether to use nix-community/cache-nix-action to cache /nix/store in GHA (opt-in)
    type: boolean
    required: false
    default: false
  nix-cache-key:
    description: The primary key to use for the Nix GHA cache; defaults to the current commit so disabled caching does not eagerly evaluate hashFiles()
    required: false
    default: nix-${{ runner.os }}-${{ github.sha }}
  nix-cache-restore-prefixes:
    description: The fallback restore prefixes for the Nix GHA cache
    required: false
    default: |
      nix-${{ runner.os }}-
  netbird-setup-key:
    description: Optional NetBird setup key. When set on a Linux GitHub-hosted runner, the action joins NetBird before configuring Nix substituters.
    required: false
    default: ''
  netbird-management-url:
    description: NetBird management API URL.
    required: false
    default: 'https://api.netbird.io:443'
  netbird-admin-url:
    description: NetBird admin UI URL.
    required: false
    default: 'https://app.netbird.io:443'
  netbird-cache-probe-url:
    description: Optional URL to probe after NetBird connects, usually an Attic nix-cache-info endpoint.
    required: false
    default: ''
  netbird-hostname-prefix:
    description: Hostname prefix for the transient NetBird peer.
    required: false
    default: 'gha'

runs:
  using: 'composite'
  steps:
    - name: Log GH API rate limits
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        # -------------------------------------------------------------------
        # WHY THIS STEP LOOKS LIKE THIS
        #
        # It used to be one line:
        #
        #     gh api /rate_limit | jq || true
        #
        # This is the FIRST step of the action, so it runs BEFORE Nix is
        # provisioned -- and on these runner images `gh` and `jq` come FROM
        # Nix, not from the image. Both invocations died with `command not
        # found`, `|| true` swallowed the exit status, and the step reported
        # `conclusion=success` on every job that provisions Nix while
        # measuring nothing whatsoever.
        #
        # So the one instrument in the pipeline that reports an API budget
        # has never emitted a single number, and its greenness said only that
        # `|| true` works. A diagnostic that cannot fail cannot report.
        #
        # `curl` IS on the image, so this uses curl, and it parses the JSON
        # with bash parameter expansion so the step acquires no dependency
        # that Nix would have to supply first. It now FAILS when it cannot
        # measure -- a missing curl, a non-200, or a response it cannot
        # parse -- because "the instrument is broken" and "the budget is
        # healthy" must never again be the same colour.
        #
        # WHAT THIS DOES NOT MEASURE -- stated here so the number is not
        # misread by the next person who needs it:
        #
        #   `/rate_limit` reports REST API budgets ONLY. The buckets it
        #   returns are core, search, graphql, code_search and
        #   integration_manifest. GitHub exposes NO budget for git over
        #   HTTPS, and `git clone` / `git fetch` / upload-pack traffic is
        #   not metered by `core`.
        #
        #   Therefore a healthy `remaining` here is NOT evidence that a git
        #   fetch will succeed, and an exhausted one is NOT the explanation
        #   for a clone that failed. If you are chasing
        #   `fatal: could not read Username for 'https://github.com'`, this
        #   number can neither confirm nor refute it -- that failure is an
        #   HTTP 401 on the `POST /<repo>/git-upload-pack` half of the fetch,
        #   and it has to be measured there.
        # -------------------------------------------------------------------
        set -uo pipefail

        echo "::group::GH API rate limits"

        if ! command -v curl >/dev/null 2>&1; then
          echo "::error::curl is not on this runner image, so the GH API rate limit cannot be read. This step measures nothing; do not treat other steps' success as evidence about API budgets."
          echo "::endgroup::"
          exit 1
        fi

        auth=()
        if [ -n "${GH_TOKEN:-}" ]; then
          # Through the environment and into a header array -- never onto a
          # command line, where anything reading /proc could see it.
          auth=(-H "Authorization: Bearer ${GH_TOKEN}")
        else
          echo "NOTE: no GH_TOKEN in the environment; querying anonymously."
        fi

        # RETRY TRANSPORT FAILURES, BUT NEVER CREDENTIAL ONES.
        #
        # This step now fails the job when it cannot measure, and this action
        # provisions Nix for many repositories -- so a single api.github.com
        # hiccup must not redden every one of them. Three attempts with a
        # short backoff separate "GitHub blinked" from "this is broken".
        #
        # 401/403 are NOT retried: bad or missing credentials will still be
        # bad three seconds later, and retrying only delays the report.
        body="$(mktemp)"
        status="000"
        for attempt in 1 2 3; do
          status="$(curl -sS -o "${body}" -w '%{http_code}' --max-time 30 \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            ${auth[@]+"${auth[@]}"} \
            https://api.github.com/rate_limit 2>/dev/null)" || status="000"

          case "${status}" in
            200) break ;;
            401|403) break ;;
            *)
              if [ "${attempt}" -lt 3 ]; then
                echo "attempt ${attempt}: HTTP ${status} from /rate_limit; retrying"
                sleep "$((attempt * 2))"
              fi
              ;;
          esac
        done

        if [ "${status}" != "200" ]; then
          # 401/403 is the case worth failing loudest on: the token this job
          # was handed is absent, expired or malformed, and every later
          # authenticated step will hit the same wall -- but silently.
          echo "::error::GET /rate_limit returned HTTP ${status} after ${attempt} attempt(s); the API budget could not be read."
          echo "--- response body (first 400 bytes) ---"
          head -c 400 "${body}" 2>/dev/null || true
          echo
          rm -f "${body}"
          echo "::endgroup::"
          exit 1
        fi

        json="$(cat "${body}")"
        rm -f "${body}"

        # Whitespace-strip so this parses pretty-printed and compact JSON
        # alike. Safe here specifically because every value in the `core`
        # bucket is a number -- there is no string whose spaces matter.
        compact="${json//[$' \t\n\r']/}"

        core="${compact#*\"core\":\{}"
        core="${core%%\}*}"

        if [ "${core}" = "${compact}" ] || [ -z "${core}" ]; then
          echo "::error::No \"core\" bucket in the /rate_limit response; this step could not parse what GitHub returned."
          printf '%s\n' "${json}" | head -c 400
          echo
          echo "::endgroup::"
          exit 1
        fi

        field() {
          local rest="${core#*\"$1\":}"
          printf '%s' "${rest%%,*}"
        }

        limit="$(field limit)"
        remaining="$(field remaining)"
        used="$(field used)"
        reset="$(field reset)"

        case "${limit}|${remaining}|${used}|${reset}" in
          *[!0-9\|]* | *'||'* | '|'* | *'|')
            echo "::error::/rate_limit returned a core bucket this step could not parse into numbers."
            printf '  core = %s\n' "${core}" | head -c 300
            echo
            echo "::endgroup::"
            exit 1
            ;;
        esac

        reset_human="$(date -u -d "@${reset}" '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null \
          || date -u -r "${reset}" '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null \
          || echo 'unix seconds')"

        echo "core.limit     : ${limit}"
        echo "core.remaining : ${remaining}"
        echo "core.used      : ${used}"
        echo "core.reset     : ${reset} (${reset_human})"

        # The LIMIT says which identity GitHub billed this to, and that is
        # worth more than the remaining count: it is the only cheap way to
        # notice that a token was never sent or was silently ignored.
        case "${limit}" in
          60)    echo "IDENTITY: limit=60 -> UNAUTHENTICATED. The token was not sent or was rejected, and every API call in this job shares one budget with every other job on this runner's egress IP." ;;
          5000)  echo "IDENTITY: limit=5000 -> authenticated as a user or GITHUB_TOKEN." ;;
          15000) echo "IDENTITY: limit=15000 -> authenticated as a GitHub App installation." ;;
          *)     echo "IDENTITY: limit=${limit} -> unrecognised tier; record this if it recurs." ;;
        esac

        if [ "${remaining}" -lt 100 ]; then
          echo "::warning::Only ${remaining} of ${limit} REST API requests remain (resets at ${reset_human})."
        fi

        echo "::endgroup::"

    - name: Check if Nix is available
      id: check-nix
      shell: bash
      run: |
        if [[ -L /nix ]]; then
          echo "symlinked_store=true" >> "$GITHUB_OUTPUT"
          echo "Detected a symlinked /nix store"
        else
          echo "symlinked_store=false" >> "$GITHUB_OUTPUT"
        fi

        if command -v nix &>/dev/null; then
          echo "has_nix=true" >> "$GITHUB_OUTPUT"
          echo "Nix is already installed: $(nix --version)"
        else
          echo "has_nix=false" >> "$GITHUB_OUTPUT"
          echo "Nix is not installed, will install it"
        fi

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@v22
      if: steps.check-nix.outputs.has_nix != 'true'
      with:
        determinate: false
        extra-conf: ${{ steps.check-nix.outputs.symlinked_store == 'true' && 'allow-symlinked-store = true' || '' }}

    - name: Connect NetBird
      if: ${{ inputs.netbird-setup-key != '' && runner.os == 'Linux' }}
      shell: bash
      env:
        NETBIRD_SETUP_KEY: ${{ inputs.netbird-setup-key }}
        NETBIRD_MANAGEMENT_URL: ${{ inputs.netbird-management-url }}
        NETBIRD_ADMIN_URL: ${{ inputs.netbird-admin-url }}
        NETBIRD_CACHE_PROBE_URL: ${{ inputs.netbird-cache-probe-url }}
        NETBIRD_HOSTNAME_PREFIX: ${{ inputs.netbird-hostname-prefix }}
      run: |
        set -euo pipefail

        echo "::add-mask::$NETBIRD_SETUP_KEY"

        if ! command -v netbird >/dev/null 2>&1; then
          curl -fsSL https://pkgs.netbird.io/install.sh | sh
        fi

        sudo netbird service install >/dev/null 2>&1 || true
        sudo netbird service start >/dev/null 2>&1 || true

        repo_slug="${GITHUB_REPOSITORY//\//-}"
        hostname="${NETBIRD_HOSTNAME_PREFIX}-${repo_slug}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        hostname="$(echo "$hostname" | tr -c 'A-Za-z0-9._-' '-')"

        sudo netbird up \
          --setup-key "$NETBIRD_SETUP_KEY" \
          --hostname "$hostname" \
          --management-url "$NETBIRD_MANAGEMENT_URL" \
          --admin-url "$NETBIRD_ADMIN_URL"

        sudo netbird status || true

        if [[ -n "$NETBIRD_CACHE_PROBE_URL" ]]; then
          for attempt in $(seq 1 30); do
            if curl -fsS --connect-timeout 2 --max-time 5 "$NETBIRD_CACHE_PROBE_URL" >/dev/null; then
              echo "NetBird probe succeeded: $NETBIRD_CACHE_PROBE_URL"
              exit 0
            fi
            echo "Waiting for NetBird route to become usable ($attempt/30)..."
            sleep 2
          done

          echo "NetBird probe failed after waiting: $NETBIRD_CACHE_PROBE_URL" >&2
          curl -v --connect-timeout 5 --max-time 10 "$NETBIRD_CACHE_PROBE_URL" >&2 || true
          exit 1
        fi

    - name: Reject unsupported NetBird runner
      if: ${{ inputs.netbird-setup-key != '' && runner.os != 'Linux' }}
      shell: bash
      run: |
        echo "NetBird setup is currently implemented only for Linux GitHub-hosted runners." >&2
        exit 1

    - name: Configure Nix
      shell: bash
      # Through the environment, never onto a command line, where anything
      # able to read /proc could see it.
      env:
        SETUP_NIX_GITHUB_TOKEN: ${{ inputs.nix-github-token }}
      run: |
        mkdir -p $HOME/.config/nix

        cat << EOF > "$HOME/.config/nix/nix.conf"
          ${{
            (inputs.nix-github-token != '' && inputs.nix-gitlab-token != '' && inputs.nix-gitlab-domain != '' &&
              format('access-tokens = github.com={0} {1}=PAT:{2}', inputs.nix-github-token, inputs.nix-gitlab-domain, inputs.nix-gitlab-token)) ||
            (inputs.nix-github-token != '' &&
              format('access-tokens = github.com={0}', inputs.nix-github-token)) ||
            (inputs.nix-gitlab-token != '' && inputs.nix-gitlab-domain != '' &&
              format('access-tokens = {0}=PAT:{1}', inputs.nix-gitlab-domain, inputs.nix-gitlab-token)) ||
            ''
          }}

          fallback = true
          download-attempts = 2
          connect-timeout = 5
          # Persistent self-hosted runners have observed a group of multiplexed
          # cache.nixos.org NAR transfers make no progress until the job ceiling.
          # Bound silent transfers and prefer a smaller HTTP/1.1 pool so Nix can
          # retry an individual object instead of wedging the whole substitution.
          stalled-download-timeout = 30
          http2 = false
          http-connections = 8
          narinfo-cache-negative-ttl = 120
          allow-import-from-derivation = true
          experimental-features = ${{ inputs.experimental-features }}

          substituters = https://cache.nixos.org ${{inputs.substituters}}
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= ${{inputs.trusted-public-keys}}
          netrc-file = $HOME/.config/nix/netrc
        EOF

        if [[ "${{ steps.check-nix.outputs.symlinked_store }}" == "true" ]]; then
          echo "allow-symlinked-store = true" >> "$HOME/.config/nix/nix.conf"
        fi

        touch "$HOME/.config/nix/netrc"
        chmod 0600 "$HOME/.config/nix/netrc"

        # `access-tokens` above only reaches Nix's OWN GitHub/GitLab fetchers
        # (`github:` / `gitlab:` refs). A `type = "git"` input over https is
        # fetched by shelling out to git, which never sees it — see the header
        # of write-netrc.sh for the full reasoning and the real failure it fixes.
        bash "${{ github.action_path }}/write-netrc.sh"

    # Writing nix.conf is not the same as the setting being IN EFFECT, and the
    # gap between those two is where the defect of the third-party installer
    # action this repo migrated away from lives: on the `eph-*` images Nix is
    # already installed, that action aborts with "Nix is already installed" and
    # exit 0, never applies `experimental-features`, and the job dies much later
    # in an unrelated step with "nix-command is disabled".
    #
    # That action is named, with the full story, in the header of
    # verify-nix-config.sh. It is deliberately NOT named in this file:
    # checks/deployment-production-cutover.nix asserts that action.yml contains
    # no occurrence of that vendor's name at all, to prove the migration to the
    # Determinate installer is complete. That guard is a plain substring ban and
    # cannot tell code from comments, so spelling the name here — even in a
    # comment — fails the check. Keep the name in verify-nix-config.sh, which
    # the guard does not read.
    #
    # This action writes nix.conf unconditionally so it does not no-op that way,
    # but it should not merely CLAIM to have configured Nix either. Prove it, by
    # functional probe, before any step that depends on it. See the header of
    # verify-nix-config.sh for why the probes deliberately do not pass
    # `--extra-experimental-features`.
    - name: Verify the Nix configuration took effect
      shell: bash
      env:
        SETUP_NIX_REQUIRED_EXPERIMENTAL_FEATURES: ${{ inputs.experimental-features }}
      run: bash "${{ github.action_path }}/verify-nix-config.sh"

    - name: Start Attic watch-store
      if: ${{ inputs.attic-token != '' && inputs.attic-cache != '' }}
      shell: bash
      env:
        ATTIC_TOKEN: ${{ inputs.attic-token }}
        ATTIC_CACHE: ${{ inputs.attic-cache }}
        ATTIC_ENDPOINT: ${{ inputs.attic-endpoint }}
      run: |
        set -euo pipefail
        echo "::add-mask::$ATTIC_TOKEN"

        attic=(nix shell --accept-flake-config nixpkgs#attic-client -c attic)
        "${attic[@]}" login --set-default ci "$ATTIC_ENDPOINT" "$ATTIC_TOKEN"

        log="${RUNNER_TEMP:-/tmp}/attic-watch-store.log"
        nohup "${attic[@]}" watch-store \
          --jobs 1 \
          "$ATTIC_CACHE" >"$log" 2>&1 &
        echo "$!" > "${RUNNER_TEMP:-/tmp}/attic-watch-store.pid"
        echo "Attic watch-store started for $ATTIC_CACHE (log: $log)"

    - name: Reset Nix flake fetcher cache
      shell: bash
      run: |
        cache_dir="${XDG_CACHE_HOME:-$HOME/.cache}/nix"
        rm -f "$cache_dir"/fetcher-cache-v*.sqlite*
        rm -rf "$cache_dir"/gitv3 "$cache_dir"/tarballs

    - name: Restore/Save Nix Store GHA Cache
      uses: nix-community/cache-nix-action@v7
      if: ${{ fromJSON(inputs.use-nix-cache || 'false') }}
      with:
        primary-key: ${{ inputs.nix-cache-key }}
        restore-prefixes-first-match: ${{ inputs.nix-cache-restore-prefixes }}

    # Resolve which flake devShell to build/activate, validating the inputs.
    # In `devshell` mode the ref is given directly; in `use-direnv` mode we read
    # it from the repo's .envrc when it loads a flake (`use flake [ref]`,
    # defaulting to the '.' default devShell). The output `flake-ref` stays
    # empty for non-flake .envrc files, which we cannot pre-build generically.
    - name: Determine the devShell to build
      id: determine-devshell
      if: ${{ fromJSON(inputs.use-direnv || 'false') || inputs.devshell != '' }}
      shell: bash
      run: |
        if [ "${{ inputs.devshell }}" != "" ] && [ "${{ inputs.use-direnv }}" == "true" ]; then
          echo "Error: 'devshell' and 'use-direnv' are mutually exclusive."
          exit 1
        fi

        flake_ref=""
        if [ "${{ inputs.devshell }}" != "" ]; then
          flake_ref=".#${{ inputs.devshell }}"
        elif [ "${{ inputs.use-direnv }}" == "true" ]; then
          if [ ! -f .envrc ]; then
            echo "Error: 'use-direnv' is enabled but .envrc does not exist."
            exit 1
          fi
          if grep -qE '^[[:space:]]*use[[:space:]]+flake' .envrc; then
            flake_ref="$(sed -n 's/^[[:space:]]*use[[:space:]][[:space:]]*flake[[:space:]]*//p' .envrc | head -n1)"
            flake_ref="${flake_ref:-.}"
          fi
        fi

        echo "flake-ref=$flake_ref" >> "$GITHUB_OUTPUT"
        echo "Resolved devShell flake ref: '${flake_ref:-<none>}'"

    # Build the devShell explicitly so a build/eval failure aborts the job here
    # with a clear error. This is necessary because direnv's `use flake`
    # swallows such failures: it runs `eval "$(nix print-dev-env ...)"`, so when
    # the devShell fails to build the substitution is empty, `eval ""` succeeds,
    # and the later `direnv export` still exits 0 while leaving $GITHUB_ENV
    # without the devShell's PATH. The action would then report success and the
    # real failure would only surface in a later step as an obscure
    # "<tool>: command not found" (exit 127). `nix print-dev-env` propagates the
    # build/eval exit code, so we use it to fail fast.
    - name: Build the Nix DevShell
      if: ${{ steps.determine-devshell.outputs.flake-ref != '' }}
      shell: bash
      run: |
        echo "::group::Building Nix DevShell"
        nix --extra-experimental-features "nix-command flakes pipe-operators" \
          print-dev-env "${{ steps.determine-devshell.outputs.flake-ref }}" >/dev/null
        echo "::endgroup::"

    # Generate the .envrc (in `devshell` mode) or use the repo's existing one
    # (in `use-direnv` mode), then export the devShell environment to
    # $GITHUB_ENV via direnv so subsequent steps run inside it.
    - name: Activate the Nix DevShell
      if: ${{ fromJSON(inputs.use-direnv || 'false') || inputs.devshell != '' }}
      shell: bash
      run: |
        set -euo pipefail

        direnv() { nix run --inputs-from . nixpkgs#direnv -- "$@"; }

        if [ "${{ inputs.devshell }}" != "" ]; then
          # Function to restore .envrc
          restore_envrc() {
            if git ls-files --error-unmatch .envrc > /dev/null 2>&1; then
              git restore .envrc
            else
              rm -f .envrc
            fi
          }
          # Set trap to restore .envrc on exit (success or failure)
          trap restore_envrc EXIT

          echo "use flake .#${{ inputs.devshell }}" > .envrc
        fi

        direnv allow .
        echo "::group::Exporting Nix DevShell to GITHUB_ENV"
        export_file="$(mktemp "${RUNNER_TEMP:-/tmp}/nix-devshell-env.XXXXXX")"
        loader_file="${export_file}.ld-library-path"
        direnv export gha > "$export_file"
        : > "$loader_file"

        # direnv's GHA format uses one multiline record per variable. Copy
        # every record except LD_LIBRARY_PATH verbatim, and capture that value
        # for Bash run steps below. A line-oriented grep/sed would leave the
        # value and delimiter behind and corrupt GITHUB_ENV.
        while IFS= read -r header; do
          if [[ "$header" != *"<<"* ]]; then
            echo "Invalid direnv GHA export header: $header" >&2
            exit 1
          fi
          key="${header%%<<*}"
          delimiter="${header#*<<}"
          if [[ -z "$key" || -z "$delimiter" ]]; then
            echo "Invalid direnv GHA export record: $header" >&2
            exit 1
          fi

          if [[ "$key" != "LD_LIBRARY_PATH" ]]; then
            printf '%s\n' "$header" >> "$GITHUB_ENV"
          fi

          record_complete=false
          while IFS= read -r line; do
            if [[ "$line" == "$delimiter" ]]; then
              if [[ "$key" != "LD_LIBRARY_PATH" ]]; then
                printf '%s\n' "$line" >> "$GITHUB_ENV"
              fi
              record_complete=true
              break
            fi
            if [[ "$key" == "LD_LIBRARY_PATH" ]]; then
              printf '%s\n' "$line" >> "$loader_file"
            else
              printf '%s\n' "$line" >> "$GITHUB_ENV"
            fi
          done
          if [[ "$record_complete" != "true" ]]; then
            echo "Unterminated direnv GHA export record for $key" >&2
            exit 1
          fi
        done < "$export_file"

        devshell_ld_library_path="$(cat "$loader_file")"
        previous_bash_env="${BASH_ENV:-}"
        nix_bash_env="$(mktemp "${RUNNER_TEMP:-/tmp}/nix-devshell-bash-env.XXXXXX")"
        {
          if [[ -n "$previous_bash_env" ]]; then
            printf 'if [[ -f %q ]]; then source %q; fi\n' "$previous_bash_env" "$previous_bash_env"
          fi
          printf 'if [[ ${AH_DISABLE_DEVSHELL_LD_LIBRARY_PATH:-0} == 1 ]]; then\n'
          printf '  unset LD_LIBRARY_PATH\n'
          printf 'else\n'
          printf '  export LD_LIBRARY_PATH=%q\n' "$devshell_ld_library_path"
          printf 'fi\n'
        } > "$nix_bash_env"
        chmod 0600 "$nix_bash_env"

        # JavaScript actions (including post actions) execute the runner's host
        # Node binary. Keep Nix libstdc++ out of that process; GitHub's
        # noninteractive Bash run steps source BASH_ENV and recover the
        # devshell loader path. AH_DISABLE_DEVSHELL_LD_LIBRARY_PATH=1 gives an
        # individual Bash step an explicit host-loader opt-out.
        printf 'LD_LIBRARY_PATH=\n' >> "$GITHUB_ENV"
        printf 'BASH_ENV=%s\n' "$nix_bash_env" >> "$GITHUB_ENV"
        echo "::endgroup::"
