name: 'ci-matrix'

on:
  # Allow this workflow to be reused by other workflows:
  workflow_call:
    inputs:
      runners:
        description: 'JSON-encoded map of nix system to its RC1 capability label set'
        # Map each Nix system to its minimum capability label set (RC1):
        # Linux x64 -> [self-hosted, linux, x64], macOS arm64 ->
        # [self-hosted, macos, arm64] (the two Nix systems this matrix covers).
        default: | # json
          {
            "x86_64-linux": [
              "self-hosted",
              "linux",
              "x64"
            ],
            "aarch64-darwin": [
              "self-hosted",
              "macos",
              "arm64"
            ]
          }
        required: false
        type: string
      non-nix-runner:
        description: 'JSON-encoded helper runner labels (comments, reference compute, and matrix planning)'
        default: '["self-hosted","linux","x64"]'
        required: false
        type: string
      results-runner:
        description: 'JSON-encoded runner label set for Final Results and deploy orchestration'
        default: '["self-hosted","linux","x64"]'
        required: false
        type: string
      foundry-darwin-bootstrap-runner:
        description: 'Temporary JSON-encoded runner class for Foundry on Darwin while gosti lifetime fixes are deployed'
        default: ''
        required: false
        type: string
      build-max-jobs:
        # Opt-in fan-out cap. The build matrix is one GitHub job per flake
        # output, which is fine on an elastic runner class and ruinous on a
        # capped one: the macOS pool tops out at 2 concurrent runners, so a
        # single run asking for ~50 `aarch64-darwin` jobs monopolises the
        # class for hours and starves every other repo behind it.
        #
        # Set a system's value to cap how many BUILD JOBS that system may use.
        # Outputs are distributed evenly across that many jobs and each job
        # builds its share sequentially. Nothing is dropped: every output is
        # still built, still reported by name, and still able to fail the run
        # (see the `Build` step). Systems absent from the map keep one job per
        # output, so the default `{}` reproduces the previous behaviour
        # exactly and no caller changes unless it opts in.
        description: 'JSON-encoded map of nix system to the maximum number of build jobs for that system ({} = one job per flake output)'
        default: '{}'
        required: false
        type: string
      build-systems:
        # Restrict the BUILD jobs to these Nix systems; empty = every system.
        # A caller can split one flake's CI into independent calls, e.g. a
        # Linux call that gates a deployment and a Darwin call that only
        # reports, so a starved macOS pool cannot hold a Linux deployment
        # (infra, 2026-10-08: 27 queued aarch64-darwin legs behind other
        # repositories' jobs blocked fleet publication). A filter that leaves
        # nothing builds a single no-op instead of falling back to the
        # unfiltered matrix.
        #
        # EVAL FOLLOWS THE SAME SYSTEMS. Until 2026-10-28 eval still covered
        # every system, so infra's `ci` + `ci-darwin` pair evaluated all 26
        # shards twice per run (52 eval jobs, ~78 runner-minutes, infra run
        # 40628261206). A sharded flake now gets `shardsPerSystem.<system>`
        # shards for just these systems (output names are unchanged), and an
        # unsharded one evaluates just these systems. The union of a split
        # caller's calls still evaluates every system, each exactly once.
        # Empty keeps evaluating every system.
        description: 'JSON array of Nix systems whose outputs this call builds and evaluates (empty = all)'
        default: ''
        required: false
        type: string
      build-timeout-minutes:
        # A hung build used to hold its runner for GitHub's 360-minute default.
        # On 2026-10-08 one `gprbuild | aarch64-darwin` job hung in `make` at 0%
        # CPU on m3, the only macOS runner then taking work, and held it toward
        # that 6 h limit, stalling every repository's macOS CI behind it,
        # including infra's fleet deployment.
        #
        # 270 = the longest legitimate build observed across the callers
        # (nix-codetracer-toolchains / devops-modules / nix-nim-development /
        # nix-blockchain-development, last 60 runs each, 2026-10-08): a cold
        # `gnat | aarch64-darwin` at 217 min, then `gcc13` at 175 min, plus
        # ~25% margin. p99 was 35-48 min. A caller whose build or
        # `build-max-jobs` batch legitimately needs longer raises this.
        description: "Per-job timeout in minutes for each build matrix job (well under GitHub's 360-minute default)"
        default: 270
        required: false
        type: number
      eval-fail-fast:
        # GitHub's default for a matrix: the first failing `eval-matrix` shard
        # cancels every other shard. That suits a real evaluation error, which
        # the other shards cannot fix, but most shard failures on the shared
        # runner pools are environmental, and then fail-fast turns one lost
        # shard into a whole re-run: infra #2480 (2026-11-25) lost shard 05 to
        # a DNS failure in the Nix installer and fail-fast cancelled 22
        # running and queued shards; #2455 (2026-11-24, run 45255223639) lost
        # one memory-killed shard and 24 more were cancelled, then 3 more on
        # attempt 2. `gh run rerun --failed` re-runs cancelled jobs too, so
        # every cancelled shard queued again on the scarce pool. With 'false'
        # the healthy shards finish, and a re-run repeats only the failed one.
        #
        # This changes no result. `Merge matrices` runs only when every shard
        # succeeded (`needs.eval-matrix.result == 'success'`), and a failed
        # shard fails the run, and with it the caller's `needs.<call>.result`,
        # either way. The `build` matrix is already `fail-fast: false`.
        description: 'Cancel the remaining eval-matrix shards when one fails (GitHub default); false lets them finish'
        default: true
        required: false
        type: boolean
      push-deployment-caches:
        description: 'Push deployment target closures to configured deployment cache backends'
        default: false
        required: false
        type: 'boolean'
      push-check-caches:
        # Push the output of every SUCCESSFUL non-deployment build (checks,
        # packages) to the Attic cache, so the next run finds it cached and
        # does not build it again. Before this, only deployment closures were
        # ever pushed, so an unchanged check such as infra's `rescue-netboot`
        # (15 derivations, a VM test) was rebuilt from source on every PR.
        #
        # '' (the default) follows `push-deployment-caches`: a caller that
        # publishes from its trusted branch publishes check results from it
        # too, and a PR run pushes nothing, exactly as before. 'true' or
        # 'false' overrides that. The push uses the same `ATTIC_TOKEN` push
        # credential and Attic variables as the deployment push, and it never
        # fails the job: a cache hiccup only costs a rebuild next time.
        description: "Push successful non-deployment build outputs to Attic: '' = follow push-deployment-caches, 'true', or 'false'"
        default: ''
        required: false
        type: string
      deployment-cache-push-backends:
        description: 'Comma-separated cache push backends for deployment closures: attic, none'
        default: 'attic'
        required: false
        type: string
      deployment-cache-required-backends:
        description: 'Comma-separated attempted cache push backends that must succeed'
        default: 'attic'
        required: false
        type: string
      deployment-cache-optional-timeout-seconds:
        description: 'Maximum seconds for each optional cache backend command'
        default: '300'
        required: false
        type: string
    secrets:
      ATTIC_PULL_TOKEN:
        description: 'Read-only Attic token for cache substitution and status probes'
        required: false
      ATTIC_TOKEN:
        description: 'Attic push token for optional deployment closure mirroring and pull-token fallback'
        required: false
      NIX_GITHUB_TOKEN:
        description: GitHub token to add as access-token in nix.conf
        required: false
      GH_READ_METACRAFT_PRIVATE_REPOS:
        description: 'Legacy org-wide read token used only when NIX_GITHUB_TOKEN is unset (optional)'
        required: false
      NIX_GITLAB_TOKEN:
        description: GitLab token to add as access-token in nix.conf
        required: false
      # In-house S3 artifact store (Garage on high-mem-server). When set, CI
      # artifacts are ALSO mirrored to the `ci-artifacts` bucket over the
      # NetBird VPN, moving them off GitHub's quota-limited artifact storage.
      # The upload is strictly non-blocking. Distributed per-repo by
      # infra/scripts/s3-artifact-store/configure-github-repo.sh.
      MCL_S3_ARTIFACTS_ACCESS_KEY_ID:
        description: 'S3 access key id for the CI artifact store (optional)'
        required: false
      MCL_S3_ARTIFACTS_SECRET_ACCESS_KEY:
        description: 'S3 secret access key for the CI artifact store (optional)'
        required: false

jobs:
  compute-mcl-ref:
    name: Compute MCL Reference
    runs-on: ${{ fromJSON(inputs.non-nix-runner) }}
    outputs:
      workflow_sha: ${{ steps.compute.outputs.workflow_sha }}
      mcl_flake_cmd: ${{ steps.compute.outputs.mcl_flake_cmd }}
    steps:
      - name: Compute reusable workflow SHA and set mcl nix run command
        id: compute
        shell: bash
        run: |
          set -euo pipefail

          is_commit_sha() {
            [[ "$1" =~ ^[0-9a-fA-F]{40}$ ]]
          }

          workflow_repo=""
          case "${GITHUB_WORKFLOW_REF:-}" in
            metacraft-labs/devops-modules/.github/workflows/reusable-flake-checks-ci-matrix.yml@*)
              workflow_repo="metacraft-labs/devops-modules"
              ;;
          esac

          mcl_ref=""

          if [[ "${GITHUB_REPOSITORY:-}" == "metacraft-labs/devops-modules" ]] &&
            is_commit_sha "${GITHUB_SHA:-}"; then
            # Local calls from devops-modules PRs should test the PR commit.
            mcl_ref="$GITHUB_SHA"
          elif [[ "$workflow_repo" == "metacraft-labs/devops-modules" ]] &&
            is_commit_sha "${GITHUB_WORKFLOW_SHA:-}"; then
            mcl_ref="$GITHUB_WORKFLOW_SHA"
          else
            echo "::warning title=MCL workflow ref fallback::Could not read a valid devops-modules workflow SHA from GitHub Actions context; using dev"
            mcl_ref="dev"
          fi

          if ! is_commit_sha "$mcl_ref" && [[ "$mcl_ref" != "dev" ]]; then
            echo "::warning title=Invalid MCL workflow ref::Ignoring invalid workflow ref '$mcl_ref'; using dev"
            mcl_ref="dev"
          fi

          {
            printf 'workflow_sha=%s\n' "$mcl_ref"
            printf 'mcl_flake_cmd=nix --option download-attempts 5 run --accept-flake-config github:metacraft-labs/devops-modules/%s#mcl-devops\n' "$mcl_ref"
          } >> "$GITHUB_OUTPUT"

  post-initial-comment:
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(inputs.non-nix-runner) }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: 'Post initial package status comment'
        uses: metacraft-labs/devops-modules/.github/sticky-comment@dev
        with:
          # One comment per call: a split caller's calls each report their own systems.
          key: ${{ inputs.build-systems }}
          message: |
            Thanks for your Pull Request!

            This comment will be updated automatically with the status of each package.

  shard-matrix:
    needs: compute-mcl-ref
    runs-on: ${{ fromJSON(inputs.non-nix-runner) }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Setup Nix
        uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        with: &setup-nix-no-push
          push-to-cache: false
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.NIX_GITHUB_TOKEN || secrets.GH_READ_METACRAFT_PRIVATE_REPOS || github.token }}
          nix-gitlab-token: ${{ secrets.NIX_GITLAB_TOKEN }}
          nix-gitlab-domain: ${{ vars.NIX_GITLAB_DOMAIN }}
          # Nix reads a private cache through netrc, and setup-nix writes netrc
          # in its own `Configure Nix` step — BEFORE `Probe binary caches`.
          # Passing the pull token here is what lets that probe authenticate.
          # Without it the probe gets HTTP 401 and probe-substituters.sh REMOVES
          # the private cache from nix.conf for the remainder of the job, so
          # every path only that cache holds is rebuilt from source. The
          # standalone netrc step that follows runs after the probe, and it only
          # writes netrc — it cannot restore an already-dropped substituter.
          #
          # Uploads stay off: `Start Attic watch-store` also requires
          # `attic-cache`, which no job here passes, and push-to-cache is false.
          attic-token: ${{ secrets.ATTIC_PULL_TOKEN || secrets.ATTIC_TOKEN }}

      - name: Authenticate nix to the private Attic cache
        shell: bash
        env:
          ATTIC_SUBSTITUTER: ${{ vars.ATTIC_SUBSTITUTER }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_PULL_TOKEN || secrets.ATTIC_TOKEN }}
        run: |
          [ -n "$ATTIC_SUBSTITUTER" ] && [ -n "$ATTIC_TOKEN" ] || exit 0
          h="${ATTIC_SUBSTITUTER#http://}"; h="${h#https://}"; h="${h%%/*}"
          mkdir -p "$HOME/.config/nix"
          touch "$HOME/.config/nix/netrc"
          chmod 0600 "$HOME/.config/nix/netrc"
          grep -q "^machine $h " "$HOME/.config/nix/netrc" 2>/dev/null || \
            printf 'machine %s password %s\n' "$h" "$ATTIC_TOKEN" >> "$HOME/.config/nix/netrc"

      - uses: actions/checkout@v7

      - name: Generate Shard Matrix
        id: generate-matrix
        env:
          EXTRA_CACHE_URLS: ${{ vars.SUBSTITUTERS }}
          SYSTEM_TO_GITHUB_RUNNER_LABELS: ${{ inputs.runners }}
          # Evaluate only the systems this call builds (see `build-systems`).
          MCL_EVAL_SYSTEMS: ${{ inputs.build-systems }}
          # Authenticate mcl-devops's cache-status (narinfo) probe to the private
          # Attic cache; scoped to the Attic host inside mcl-devops.
          ATTIC_SUBSTITUTER: ${{ vars.ATTIC_SUBSTITUTER }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_PULL_TOKEN || secrets.ATTIC_TOKEN }}
        run: ${{ needs.compute-mcl-ref.outputs.mcl_flake_cmd }} shard-matrix

      - name: Post CI matrix comment
        if: steps.generate-matrix.outputs.full_matrix
        uses: metacraft-labs/devops-modules/.github/sticky-comment@dev
        with:
          # One comment per call: a split caller's calls each report their own systems.
          key: ${{ inputs.build-systems }}
          path: comment.md

    outputs:
      eval_matrix: ${{ steps.generate-matrix.outputs.eval_matrix }}
      eval_artifact_pattern: ${{ steps.generate-matrix.outputs.eval_artifact_pattern }}
      build_matrix: ${{ steps.generate-matrix.outputs.build_matrix }}
      full_matrix: ${{ steps.generate-matrix.outputs.full_matrix }}

  eval-matrix:
    needs: [compute-mcl-ref, shard-matrix]
    runs-on: ${{ fromJSON(inputs.non-nix-runner) }}
    if: needs.shard-matrix.outputs.eval_matrix
    strategy:
      # See the `eval-fail-fast` input.
      fail-fast: ${{ inputs.eval-fail-fast }}
      matrix: ${{fromJSON(needs.shard-matrix.outputs.eval_matrix)}}
    steps:
      - name: Setup Nix
        uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        with:
          push-to-cache: false
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.NIX_GITHUB_TOKEN || secrets.GH_READ_METACRAFT_PRIVATE_REPOS || github.token }}
          nix-gitlab-token: ${{ secrets.NIX_GITLAB_TOKEN }}
          nix-gitlab-domain: ${{ vars.NIX_GITLAB_DOMAIN }}
          # Nix reads a private cache through netrc, and setup-nix writes netrc
          # in its own `Configure Nix` step — BEFORE `Probe binary caches`.
          # Passing the pull token here is what lets that probe authenticate.
          # Without it the probe gets HTTP 401 and probe-substituters.sh REMOVES
          # the private cache from nix.conf for the remainder of the job, so
          # every path only that cache holds is rebuilt from source. The
          # standalone netrc step that follows runs after the probe, and it only
          # writes netrc — it cannot restore an already-dropped substituter.
          #
          # Uploads stay off: `Start Attic watch-store` also requires
          # `attic-cache`, which no job here passes, and push-to-cache is false.
          attic-token: ${{ secrets.ATTIC_PULL_TOKEN || secrets.ATTIC_TOKEN }}

      - name: Authenticate nix to the private Attic cache
        shell: bash
        env:
          ATTIC_SUBSTITUTER: ${{ vars.ATTIC_SUBSTITUTER }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_PULL_TOKEN || secrets.ATTIC_TOKEN }}
        run: |
          [ -n "$ATTIC_SUBSTITUTER" ] && [ -n "$ATTIC_TOKEN" ] || exit 0
          h="${ATTIC_SUBSTITUTER#http://}"; h="${h#https://}"; h="${h%%/*}"
          mkdir -p "$HOME/.config/nix"
          touch "$HOME/.config/nix/netrc"
          chmod 0600 "$HOME/.config/nix/netrc"
          grep -q "^machine $h " "$HOME/.config/nix/netrc" 2>/dev/null || \
            printf 'machine %s password %s\n' "$h" "$ATTIC_TOKEN" >> "$HOME/.config/nix/netrc"

      - uses: actions/checkout@v7

      - name: Generate CI Matrix
        id: generate-matrix
        shell: bash
        env:
          EXTRA_CACHE_URLS: ${{ vars.SUBSTITUTERS }}
          SYSTEM_TO_GITHUB_RUNNER_LABELS: ${{ inputs.runners }}
          MCL_EVAL_SYSTEMS: ${{ inputs.build-systems }}
          # See the `Merge matrices` step.
          MCL_REBUILD_CACHED_DEPLOYMENT_TARGETS: ${{ inputs.push-deployment-caches }}
          # Authenticate mcl-devops's cache-status (narinfo) probe to the private
          # Attic cache; scoped to the Attic host inside mcl-devops.
          ATTIC_SUBSTITUTER: ${{ vars.ATTIC_SUBSTITUTER }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_PULL_TOKEN || secrets.ATTIC_TOKEN }}
        run: |
          ${{ needs.compute-mcl-ref.outputs.mcl_flake_cmd }} -- ci-matrix \
            --flake-attribute-path "${{ matrix.flakeAttrPath }}" \
            --is-initial

      - name: Upload CI matrix shard
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: ${{ matrix.filename }}
          path: matrix-pre.json
          # `merge-matrices` reads these, and a re-run of only that job (e.g.
          # `gh run rerun --failed` after a build failure) reuses the shards
          # an EARLIER attempt uploaded. At 1 day they had expired before such
          # re-runs started: infra#2455's merge ran ~31 h after its first and
          # ~7 h after its last shard, found 0 of 26 and could not succeed.
          # The shards are a few hundred bytes to ~1 KiB each (26 of them were
          # 31 KiB), so a week costs nothing against the artifact quota that
          # 1fa3eec shortened retention for. GitHub caps this at the
          # repository's own retention limit.
          retention-days: 7
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}

  merge-matrices:
    runs-on: ${{ fromJSON(inputs.non-nix-runner) }}
    needs: [compute-mcl-ref, shard-matrix, eval-matrix]
    name: Merge matrices
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      build_matrix: ${{ steps.merge.outputs.build_matrix }}
      full_matrix: ${{ steps.merge.outputs.full_matrix }}
    if: needs.shard-matrix.outputs.eval_matrix != '{"include":[]}' &&
      needs.eval-matrix.result == 'success'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Nix
        uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        with:
          push-to-cache: false
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.NIX_GITHUB_TOKEN || secrets.GH_READ_METACRAFT_PRIVATE_REPOS || github.token }}
          nix-gitlab-token: ${{ secrets.NIX_GITLAB_TOKEN }}
          nix-gitlab-domain: ${{ vars.NIX_GITLAB_DOMAIN }}
          # Nix reads a private cache through netrc, and setup-nix writes netrc
          # in its own `Configure Nix` step — BEFORE `Probe binary caches`.
          # Passing the pull token here is what lets that probe authenticate.
          # Without it the probe gets HTTP 401 and probe-substituters.sh REMOVES
          # the private cache from nix.conf for the remainder of the job, so
          # every path only that cache holds is rebuilt from source. The
          # standalone netrc step that follows runs after the probe, and it only
          # writes netrc — it cannot restore an already-dropped substituter.
          #
          # Uploads stay off: `Start Attic watch-store` also requires
          # `attic-cache`, which no job here passes, and push-to-cache is false.
          attic-token: ${{ secrets.ATTIC_PULL_TOKEN || secrets.ATTIC_TOKEN }}

      - name: Authenticate nix to the private Attic cache
        shell: bash
        env:
          ATTIC_SUBSTITUTER: ${{ vars.ATTIC_SUBSTITUTER }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_PULL_TOKEN || secrets.ATTIC_TOKEN }}
        run: |
          [ -n "$ATTIC_SUBSTITUTER" ] && [ -n "$ATTIC_TOKEN" ] || exit 0
          h="${ATTIC_SUBSTITUTER#http://}"; h="${h#https://}"; h="${h%%/*}"
          mkdir -p "$HOME/.config/nix"
          touch "$HOME/.config/nix/netrc"
          chmod 0600 "$HOME/.config/nix/netrc"
          grep -q "^machine $h " "$HOME/.config/nix/netrc" 2>/dev/null || \
            printf 'machine %s password %s\n' "$h" "$ATTIC_TOKEN" >> "$HOME/.config/nix/netrc"

      - name: Download CI matrix shards
        uses: actions/download-artifact@v8
        if: needs.eval-matrix.result == 'success'
        continue-on-error: true
        with:
          # Only THIS call's shards. A split caller's other call (infra's
          # `ci-darwin` next to `ci`) uploads its own per-system shards into
          # the same run; merging those would put the other system's outputs
          # into this call's matrix. Empty (an mcl-devops that predates the
          # output) keeps downloading everything, as before.
          pattern: ${{ needs.shard-matrix.outputs.eval_artifact_pattern }}

      - name: Regenerate CI matrix shards when artifacts are unavailable
        if: needs.eval-matrix.result == 'success'
        shell: bash
        env:
          EVAL_MATRIX: ${{ needs.shard-matrix.outputs.eval_matrix }}
          MCL_FLAKE_CMD: ${{ needs.compute-mcl-ref.outputs.mcl_flake_cmd }}
          EXTRA_CACHE_URLS: ${{ vars.SUBSTITUTERS }}
          SYSTEM_TO_GITHUB_RUNNER_LABELS: ${{ inputs.runners }}
          MCL_EVAL_SYSTEMS: ${{ inputs.build-systems }}
          # Authenticate mcl-devops's cache-status (narinfo) probe (same reason as the
          # Merge matrices step below).
          ATTIC_SUBSTITUTER: ${{ vars.ATTIC_SUBSTITUTER }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_PULL_TOKEN || secrets.ATTIC_TOKEN }}
          # How many missing shards this job may evaluate itself. The upload
          # step is `continue-on-error` so one artifact-quota refusal does not
          # fail an eval that succeeded (f63bb2e); re-evaluating that ONE shard
          # here costs what the eval-matrix job that produced it cost. More
          # than this, or every shard, means the shards are gone wholesale
          # (expired, or the quota refused them all) and re-evaluating them
          # one after another on this non-nix runner is a whole eval-matrix
          # fan-out on a single host: infra#2455's attempt did that for 26
          # shards until nixos-ci-bare-003's swap guard killed it after 16
          # minutes. Those cases fail fast instead.
          MAX_REGENERATED_SHARDS: '1'
        run: |
          set -euo pipefail

          run_python() {
            if command -v python3 >/dev/null 2>&1; then
              python3 "$@"
            else
              nix shell nixpkgs#python3 --command python3 "$@"
            fi
          }

          # download-artifact puts each shard at <artifact name>/matrix-pre.json,
          # and the artifact name is the shard's `filename`.
          shards=()
          missing=()
          missing_attrs=()
          while IFS=$'\t' read -r filename flake_attr_path; do
            [[ -n "$filename" && -n "$flake_attr_path" ]] || continue
            shards+=("$filename")
            if [[ ! -f "$filename/matrix-pre.json" ]]; then
              missing+=("$filename")
              missing_attrs+=("$flake_attr_path")
            fi
          done < <(
            printf '%s' "$EVAL_MATRIX" |
              run_python -c 'import json, sys; [print("{}\t{}".format(shard.get("filename", ""), shard.get("flakeAttrPath", ""))) for shard in json.load(sys.stdin).get("include", [])]'
          )

          if (( ${#missing[@]} == 0 )); then
            echo "Found all ${#shards[@]} CI matrix shard artifact(s)."
            exit 0
          fi

          if (( ${#missing[@]} > MAX_REGENERATED_SHARDS || ${#missing[@]} >= ${#shards[@]} )); then
            echo "::error title=CI matrix shards missing::found $(( ${#shards[@]} - ${#missing[@]} )) of ${#shards[@]} shard artifacts; missing: ${missing[*]}. Shard artifacts are kept for the upload step's retention-days, so a re-run of only this job after they expire (or after their uploads failed) cannot get them. Re-run the shard/eval-matrix jobs (or the whole workflow): \`gh run rerun --failed\` does not re-run eval-matrix jobs that already passed. This job will not re-evaluate more than ${MAX_REGENERATED_SHARDS} shard(s) itself."
            exit 1
          fi

          echo "::warning title=Regenerating CI matrix shards::found $(( ${#shards[@]} - ${#missing[@]} )) of ${#shards[@]} shard artifacts; re-evaluating ${missing[*]} locally"
          read -r -a mcl_cmd <<< "$MCL_FLAKE_CMD"

          for index in "${!missing[@]}"; do
            artifact_dir="${missing[$index]}"
            rm -f -- matrix-pre.json

            "${mcl_cmd[@]}" -- ci-matrix \
              --flake-attribute-path "${missing_attrs[$index]}" \
              --is-initial

            mkdir -p -- "$artifact_dir"
            mv -- matrix-pre.json "$artifact_dir/matrix-pre.json"
          done

      - name: Merge matrices
        if: needs.eval-matrix.result == 'success'
        id: merge
        env:
          # A deployment target that is ALREADY CACHED gets a build job only in
          # a run that publishes deployment closures: that job pushes it and
          # proves the closure substitutes. Anywhere else (PR checks) the job
          # was pure download — every infra PR paid one KVM-runner job per
          # machine to fetch closures it had just found in the cache. Dropping
          # them keeps the PR gate's guarantee: every machine still EVALUATED
          # in this run (eval-matrix), the cached ones are in the cache by the
          # narinfo probe that marked them cached, and a CHANGED machine is
          # uncached and so is built exactly as before. The full matrix (PR
          # comment, Final Results) still lists every target.
          MCL_REBUILD_CACHED_DEPLOYMENT_TARGETS: ${{ inputs.push-deployment-caches }}
        run: ${{ needs.compute-mcl-ref.outputs.mcl_flake_cmd }} merge-ci-matrices

      - name: Generate CI matrix comment
        env:
          IS_INITIAL: 'true'
          EXTRA_CACHE_URLS: ${{ vars.SUBSTITUTERS }}
          ATTIC_SUBSTITUTER: ${{ vars.ATTIC_SUBSTITUTER }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_PULL_TOKEN || secrets.ATTIC_TOKEN }}
        # The full matrix is passed as a FILE (PRECALC_MATRIX=@path). Inline it
        # outgrew Linux's 128 KiB per-string argv/env limit and the runner
        # failed to start the step's shell ("Argument list too long").
        run: |
          matrix_file="$RUNNER_TEMP/precalc-matrix.json"
          cat > "$matrix_file" <<'MCL_PRECALC_MATRIX_EOF'
          ${{ steps.merge.outputs.full_matrix }}
          MCL_PRECALC_MATRIX_EOF
          PRECALC_MATRIX="@$matrix_file" ${{ needs.compute-mcl-ref.outputs.mcl_flake_cmd }} print-table

      - name: Post CI matrix comment
        uses: metacraft-labs/devops-modules/.github/sticky-comment@dev
        with:
          # One comment per call: a split caller's calls each report their own systems.
          key: ${{ inputs.build-systems }}
          path: comment.md

  # Collapse the one-job-per-flake-output build matrix into at most
  # `inputs.build-max-jobs[system]` jobs for the systems the caller caps.
  #
  # This job only exists for callers that opt in; when `build-max-jobs` is the
  # default `{}` it is skipped entirely and `build` falls back to the exact
  # matrix expression it used before, so non-opted-in repos see no extra job
  # and no behaviour change at all.
  plan-build-matrix:
    name: Plan build matrix
    needs: [shard-matrix, merge-matrices]
    if: >-
      !cancelled() && (
        (inputs.build-max-jobs != '' && inputs.build-max-jobs != '{}') ||
        inputs.build-systems != ''
      )
    runs-on: ${{ fromJSON(inputs.non-nix-runner) }}
    outputs:
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
    steps:
      - name: Group flake outputs into build jobs
        id: plan
        shell: bash
        env:
          # Same precedence the `build` job applies when picking its matrix:
          # the merged matrix when `merge-matrices` succeeded, otherwise the
          # shard matrix. Empty means "nothing to plan" and `build` falls back.
          SOURCE_BUILD_MATRIX: >-
            ${{
              (
                needs.merge-matrices.result == 'success' &&
                needs.merge-matrices.outputs.build_matrix
              ) ||
              needs.shard-matrix.outputs.build_matrix ||
              ''
            }}
          BUILD_MAX_JOBS: ${{ inputs.build-max-jobs }}
          BUILD_SYSTEMS: ${{ inputs.build-systems }}
          NOOP_RUNNER: ${{ toJSON(fromJSON(inputs.runners).x86_64-linux) }}
          FOUNDRY_DARWIN_BOOTSTRAP_RUNNER: ${{ inputs.foundry-darwin-bootstrap-runner }}
          PUSH_DEPLOYMENT_CACHES: ${{ inputs.push-deployment-caches }}
        run: |
          set -euo pipefail

          run_python() {
            if command -v python3 >/dev/null 2>&1; then
              python3 "$@"
            else
              # This job deliberately skips Setup Nix (it needs no Nix store),
              # so the pre-installed Nix here may still have the flake features
              # disabled. Ask for them explicitly rather than failing with the
              # familiar "nix-command is disabled".
              nix --extra-experimental-features 'nix-command flakes' \
                shell nixpkgs#python3 --command python3 "$@"
            fi
          }

          run_python - <<'PY'
          import json
          import os
          import sys

          raw = os.environ.get("SOURCE_BUILD_MATRIX", "").strip()
          raw_max_jobs = os.environ.get("BUILD_MAX_JOBS", "").strip() or "{}"
          foundry_override = os.environ.get("FOUNDRY_DARWIN_BOOTSTRAP_RUNNER", "").strip()
          push_deployment_caches = (
              os.environ.get("PUSH_DEPLOYMENT_CACHES", "").strip().lower() == "true"
          )

          def emit(matrix):
              line = "build_matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n"
              path = os.environ.get("GITHUB_OUTPUT")
              if path:
                  with open(path, "a", encoding="utf-8") as handle:
                      handle.write(line)
              else:
                  sys.stdout.write(line)

          def note(message):
              print(message)
              path = os.environ.get("GITHUB_STEP_SUMMARY")
              if path:
                  with open(path, "a", encoding="utf-8") as handle:
                      handle.write(message + "\n")

          # No source matrix at all: emit an empty plan so `build` falls back to
          # its own expression instead of inventing work.
          if not raw or raw == '{"include":[]}':
              emit({"include": []})
              sys.exit(0)

          packages = json.loads(raw).get("include", [])

          def noop_plan():
              # Never return an empty plan: `build` would fall back to the
              # UNFILTERED matrix. One no-op keeps the call's shape.
              return {"include": [{
                  "name": "no-builds-required",
                  "system": "x86_64-linux",
                  "ghRunner": json.loads(os.environ["NOOP_RUNNER"]),
                  "allowedToFail": False,
                  "noop": True,
              }]}

          # A cached deployment target only needs a job in a run that pushes
          # it (see `Merge matrices`). mcl-devops drops them already; this
          # repeats the rule here because `compute-mcl-ref` falls back to the
          # `dev` mcl-devops for cross-repo callers, so the planner is the
          # place a workflow revision's rule is guaranteed to apply.
          if not push_deployment_caches and packages:
              kept = [
                  pkg for pkg in packages
                  if not (pkg.get("deploymentTarget") and pkg.get("cachedAt"))
              ]
              if len(kept) != len(packages):
                  note("push-deployment-caches is false: skipping {} cached deployment target(s).".format(
                      len(packages) - len(kept)))
              if not kept:
                  emit(noop_plan())
                  sys.exit(0)
              packages = kept

          raw_systems = os.environ.get("BUILD_SYSTEMS", "").strip()
          if raw_systems:
              systems = json.loads(raw_systems)
              if not (isinstance(systems, list) and systems
                      and all(isinstance(item, str) and item for item in systems)):
                  raise SystemExit("build-systems must be a non-empty JSON array of Nix systems")
              kept = [pkg for pkg in packages if pkg.get("system") in systems]
              note("build-systems {}: building {} of {} flake output(s).".format(
                  systems, len(kept), len(packages)))
              if not kept:
                  emit(noop_plan())
                  sys.exit(0)
              packages = kept
          max_jobs = json.loads(raw_max_jobs) if raw_max_jobs else {}
          if not isinstance(max_jobs, dict):
              raise SystemExit("build-max-jobs must be a JSON object mapping system -> integer")

          def member(pkg):
              return {
                  "name": pkg.get("name", ""),
                  "attrPath": pkg.get("attrPath", ""),
                  "output": pkg.get("output", ""),
              }

          # name, attribute, evaluated output path (third column: what the
          # check-cache push uploads once that output has built).
          def row(pkg):
              return "{}\t{}\t{}".format(
                  pkg.get("name", ""), pkg.get("attrPath", ""), pkg.get("output", "")
              )

          def singleton(pkg):
              # Preserve the original entry verbatim and only ADD batch fields,
              # so every existing `matrix.*` reference keeps its exact meaning.
              entry = dict(pkg)
              entry["batch"] = [member(pkg)]
              entry["batchSize"] = 1
              entry["batchTsv"] = row(pkg)
              return entry

          def must_stay_alone(pkg):
              # Synthetic "nothing to build" entry.
              if pkg.get("noop"):
                  return True
              # Deployment targets carry per-target push/upload steps keyed on
              # `matrix.output` / `matrix.deploymentKind`, which only make sense
              # one target per job.
              if push_deployment_caches and pkg.get("deploymentTarget"):
                  return True
              # The Foundry Darwin bootstrap runner override is selected by
              # `matrix.name == 'foundry'`; batching would rename the job and
              # silently route it back to the ephemeral class.
              if (
                  foundry_override
                  and pkg.get("name") == "foundry"
                  and pkg.get("system") == "aarch64-darwin"
              ):
                  return True
              return False

          planned = []
          groups = {}
          group_order = []

          for pkg in packages:
              if must_stay_alone(pkg):
                  planned.append(singleton(pkg))
                  continue
              # Batches must be homogeneous in runner and in allowedToFail so
              # `runs-on` and `continue-on-error` keep working per-entry.
              key = (
                  pkg.get("system", ""),
                  json.dumps(pkg.get("ghRunner"), sort_keys=True),
                  bool(pkg.get("allowedToFail", False)),
              )
              if key not in groups:
                  groups[key] = []
                  group_order.append(key)
              groups[key].append(pkg)

          for key in group_order:
              system, _runner, allowed_to_fail = key
              members = sorted(
                  groups[key], key=lambda p: (p.get("name", ""), p.get("attrPath", ""))
              )
              limit = max_jobs.get(system)
              if not isinstance(limit, int) or isinstance(limit, bool) or limit < 1:
                  # This system is uncapped: keep one job per flake output.
                  planned.extend(singleton(pkg) for pkg in members)
                  continue
              if len(members) <= limit:
                  planned.extend(singleton(pkg) for pkg in members)
                  continue

              base, extra = divmod(len(members), limit)
              cursor = 0
              for index in range(limit):
                  size = base + (1 if index < extra else 0)
                  chunk = members[cursor:cursor + size]
                  cursor += size
                  if not chunk:
                      continue
                  planned.append({
                      "name": "batch {}/{} ({} outputs)".format(index + 1, limit, len(chunk)),
                      "system": system,
                      "ghRunner": chunk[0].get("ghRunner"),
                      "allowedToFail": allowed_to_fail,
                      "noop": False,
                      "deploymentTarget": False,
                      "deploymentKind": "",
                      "attrPath": chunk[0].get("attrPath", ""),
                      "output": "",
                      "batch": [member(pkg) for pkg in chunk],
                      "batchSize": len(chunk),
                      "batchTsv": "\n".join(row(pkg) for pkg in chunk),
                  })

          # Reconciliation: batching may reorder, but it must never drop,
          # duplicate or invent a flake output. Failing loudly here is far
          # better than silently building less than the caller asked for.
          before = sorted(
              (pkg.get("system", ""), pkg.get("name", ""), pkg.get("attrPath", ""))
              for pkg in packages
          )
          after = sorted(
              (entry.get("system", ""), item["name"], item["attrPath"])
              for entry in planned
              for item in entry["batch"]
          )
          if before != after:
              raise SystemExit(
                  "build matrix batching changed the output set: "
                  "{} in, {} out".format(len(before), len(after))
              )

          note(
              "Planned {} flake output(s) into {} build job(s) "
              "(unbatched would have been {}).".format(
                  len(before), len(planned), len(packages)
              )
          )
          emit({"include": planned})
          PY

  build:
    needs: [compute-mcl-ref, shard-matrix, merge-matrices, plan-build-matrix]
    # Still run after failed/skipped evaluation, but release superseded runs
    # without waiting for a runner to execute the no-op fallback.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix: >-
        ${{fromJSON(
          (
            needs.plan-build-matrix.result == 'success' &&
            needs.plan-build-matrix.outputs.build_matrix &&
            needs.plan-build-matrix.outputs.build_matrix != '{"include":[]}' &&
            needs.plan-build-matrix.outputs.build_matrix
          ) ||
          (
            needs.merge-matrices.result == 'success' &&
            needs.merge-matrices.outputs.build_matrix &&
            needs.merge-matrices.outputs.build_matrix != '{"include":[]}' &&
            needs.merge-matrices.outputs.build_matrix
          ) ||
          (
            needs.shard-matrix.outputs.build_matrix &&
            needs.shard-matrix.outputs.build_matrix != '{"include":[]}' &&
            needs.shard-matrix.outputs.build_matrix
          ) ||
          format(
            '{{"include":[{{"name":"no-builds-required","system":"x86_64-linux","ghRunner":{0},"allowedToFail":false,"noop":true}}]}}',
            toJSON(fromJSON(inputs.runners).x86_64-linux)
          )
        )}}

    name: ${{ matrix.name }} | ${{ matrix.system }}
    # The provider fix in this PR cannot affect the runner executing this PR.
    # Keep this narrow escape hatch until that fix is deployed, then remove it.
    runs-on: >-
      ${{
        matrix.name == 'foundry' &&
        matrix.system == 'aarch64-darwin' &&
        inputs.foundry-darwin-bootstrap-runner != '' &&
        fromJSON(inputs.foundry-darwin-bootstrap-runner) ||
        matrix.ghRunner
      }}
    continue-on-error: ${{ matrix.allowedToFail }}
    # See the `build-timeout-minutes` input.
    timeout-minutes: ${{ inputs.build-timeout-minutes }}
    steps:
      - name: No builds required
        if: ${{ matrix.noop }}
        run: |
          echo "All evaluated outputs were already present in the configured caches."

      - uses: actions/checkout@v7
        if: ${{ !matrix.noop }}

      - name: Setup Nix
        if: ${{ !matrix.noop }}
        uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        with:
          push-to-cache: false
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.NIX_GITHUB_TOKEN || secrets.GH_READ_METACRAFT_PRIVATE_REPOS || github.token }}
          nix-gitlab-token: ${{ secrets.NIX_GITLAB_TOKEN }}
          nix-gitlab-domain: ${{ vars.NIX_GITLAB_DOMAIN }}
          # Nix reads a private cache through netrc, and setup-nix writes netrc
          # in its own `Configure Nix` step — BEFORE `Probe binary caches`.
          # Passing the pull token here is what lets that probe authenticate.
          # Without it the probe gets HTTP 401 and probe-substituters.sh REMOVES
          # the private cache from nix.conf for the remainder of the job, so
          # every path only that cache holds is rebuilt from source. The
          # standalone netrc step that follows runs after the probe, and it only
          # writes netrc — it cannot restore an already-dropped substituter.
          #
          # Uploads stay off: `Start Attic watch-store` also requires
          # `attic-cache`, which no job here passes, and push-to-cache is false.
          attic-token: ${{ secrets.ATTIC_PULL_TOKEN || secrets.ATTIC_TOKEN }}

      - name: Authenticate nix to the private Attic cache
        shell: bash
        env:
          ATTIC_SUBSTITUTER: ${{ vars.ATTIC_SUBSTITUTER }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_PULL_TOKEN || secrets.ATTIC_TOKEN }}
        run: |
          [ -n "$ATTIC_SUBSTITUTER" ] && [ -n "$ATTIC_TOKEN" ] || exit 0
          h="${ATTIC_SUBSTITUTER#http://}"; h="${h#https://}"; h="${h%%/*}"
          mkdir -p "$HOME/.config/nix"
          touch "$HOME/.config/nix/netrc"
          chmod 0600 "$HOME/.config/nix/netrc"
          grep -q "^machine $h " "$HOME/.config/nix/netrc" 2>/dev/null || \
            printf 'machine %s password %s\n' "$h" "$ATTIC_TOKEN" >> "$HOME/.config/nix/netrc"

      # Each output in a batch is a separate `nix build .#<attr>`, and every one
      # of them evaluates the flake from its own source store path
      # (`/nix/store/<hash>-source`). Nothing roots that path between two
      # invocations: the second one finds it through the fetcher cache, and a
      # daemon auto-GC that runs inside that invocation deletes it from under
      # the evaluator. The build then fails with
      # `error: path '/nix/store/<hash>-source' is not valid` (m3, `min-free`
      # above free space, so auto-GC runs before almost every command;
      # metacraft-labs/infra jobs 132677356064, 133483446017, 133658250321).
      #
      # So root the flake's source for the whole job, before the first build,
      # and root every locked input that is already in the store. The roots are
      # indirect symlinks under RUNNER_TEMP, removed by the last step of this
      # job. The Build step uses the same flake reference (`.`) on the same
      # unmodified checkout, so it evaluates exactly the path rooted here.
      # scripts/tests/test_flake_source_root.py runs this script the way the
      # runners do (`bash --noprofile --norc -e -o pipefail`), under a real
      # bash 3.2 (the darwin runners' /bin/bash) and a current bash, with two
      # Nix versions, against a real store and a real GC.
      #
      # Keep it bash 3.2 compatible: no mapfile/readarray, associative arrays,
      # case-modifying expansions or `&>>`, and no arrays at all, since
      # "${empty[@]}" is an unbound variable under `set -u` before bash 4.4.
      - name: Root the flake source for this job
        if: ${{ !matrix.noop }}
        shell: bash
        run: |
          set -uo pipefail

          root_dir="${RUNNER_TEMP:-/tmp}/flake-source-roots"
          mkdir -p "$root_dir"
          meta="$root_dir/metadata.json"
          rows="$root_dir/sources.tsv"
          inputs="$root_dir/inputs.txt"
          invalid="$root_dir/invalid.txt"
          present="$root_dir/present.txt"

          # `nix flake metadata` resolves `.` and reads its lock, but from Nix
          # 2.35 on it no longer copies the source into the store. Interpolating
          # the flake fetched from its locked URL does copy it, to the path the
          # per-output builds evaluate. (`nix flake prefetch` would too, but it
          # downloads the global flake registry even for `.`.)
          # The ${...} below is Nix antiquotation, not shell expansion.
          # shellcheck disable=SC2016
          copy_self='
            "${builtins.getFlake (builtins.fromJSON (builtins.readFile (builtins.getEnv "FLAKE_SOURCE_METADATA"))).url}"
          '

          # One read-only evaluation then turns the metadata into
          # "<name>\t<store path>" rows: `self` first, then every locked input.
          # A flake input is a recursive sha256 "source" path, which is exactly
          # the output path of a fixed-output derivation with the same hash.
          # `--read-only` computes that path without writing a .drv or fetching
          # anything. Where metadata reports the source path, it must agree.
          # shellcheck disable=SC2016
          list_sources='
            let
              meta = builtins.fromJSON (builtins.readFile (builtins.getEnv "FLAKE_SOURCE_METADATA"));
              self = builtins.getEnv "FLAKE_SOURCE_SELF";
              nodes = meta.locks.nodes or { };
              rootNode = meta.locks.root or "root";
              fixed = narHash: builtins.unsafeDiscardStringContext (derivation {
                name = "source";
                system = "never-built";
                builder = "never-built";
                outputHashMode = "recursive";
                outputHashAlgo = null;
                outputHash = narHash;
              }).outPath;
              locked = name: nodes.${name}.locked or { };
              inputs = builtins.filter (name: name != rootNode && (locked name) ? narHash)
                (builtins.attrNames nodes);
            in
            assert (meta.path or self) == self
              || throw "nix flake metadata reports ${meta.path}, but the copied source is ${self}";
            builtins.concatStringsSep "" (
              [ "self\t${self}\n" ]
              ++ map (name: "${name}\t${fixed (locked name).narHash}\n") inputs
            )
          '

          self_path=""
          for attempt in 1 2 3; do
            if nix flake metadata --json . > "$meta" &&
              copied="$(FLAKE_SOURCE_METADATA="$meta" nix eval --impure --raw --expr "$copy_self")" &&
              FLAKE_SOURCE_METADATA="$meta" FLAKE_SOURCE_SELF="$copied" \
                nix eval --read-only --impure --raw --expr "$list_sources" > "$rows"; then
              self_path="$(awk -F '\t' '$1 == "self" { print $2 }' "$rows")"
              # Register the root, THEN check validity: once the root exists, a
              # path that is still valid can no longer be collected. If a GC
              # won the race in between, the next attempt copies it again.
              if [[ "$self_path" == /nix/store/*-source ]] &&
                nix-store --realise --add-root "$root_dir/self" --indirect "$self_path" > /dev/null &&
                nix-store --check-validity "$self_path"; then
                break
              fi
            fi
            echo "::warning title=Flake source root::attempt $attempt to root the flake source failed; retrying"
            self_path=""
          done
          if [[ -z "$self_path" ]]; then
            # Fatal: without the root, every output after the first can fail at
            # random with "path ... is not valid", which reads as a broken
            # check. Failing here names the real cause instead.
            echo "::error title=Flake source root::could not realise and GC-root the flake source; the per-output builds would race the garbage collector"
            exit 1
          fi
          echo "Rooted the flake source $self_path at $root_dir/self"

          # Inputs are best-effort, and deliberately so: the evidenced failure
          # is the flake's own source, and an input that cannot be rooted
          # leaves the job exactly as exposed as it was before this step.
          # Inputs a build fetches later are not covered. Store paths contain
          # no whitespace, so the unquoted $(cat ...) lists split safely.
          awk -F '\t' '$1 != "self" { print $2 }' "$rows" | sort -u > "$inputs"
          input_count="$(grep -c . "$inputs" || true)"
          if [[ "$input_count" -gt 0 ]]; then
            # shellcheck disable=SC2046
            nix-store --check-validity --print-invalid $(cat "$inputs") | sort -u > "$invalid" || true
            comm -23 "$inputs" "$invalid" > "$present"
            present_count="$(grep -c . "$present" || true)"
            # shellcheck disable=SC2046
            if [[ "$present_count" -gt 0 ]] &&
              ! nix-store --realise --add-root "$root_dir/input" --indirect $(cat "$present") > /dev/null; then
              echo "::warning title=Flake source root::could not root the $present_count locked input(s) already in the store; continuing with the flake source rooted"
            fi
            echo "Rooted $present_count of $input_count locked input source(s); $((input_count - present_count)) not yet in the store."
          fi

      - name: Build ${{ matrix.name }}
        if: ${{ !matrix.noop }}
        shell: bash
        env:
          # Newline-separated "<output name>\t<flake attribute>" rows for every
          # output this job owns. Empty when the caller has not opted into
          # `build-max-jobs`, in which case the job builds its single matrix
          # entry exactly as it always did. Passed through `env` rather than
          # interpolated into the script so names are data, never shell syntax.
          BATCH_TSV: ${{ matrix.batchTsv }}
          BATCH_FALLBACK_NAME: ${{ matrix.name }}
          BATCH_FALLBACK_ATTR: ${{ matrix.attrPath }}
          BATCH_FALLBACK_OUTPUT: ${{ matrix.output }}
        run: |
          # DELIBERATELY NOT `set -e`. A batch must attempt EVERY output even
          # after one fails; stopping at the first failure would report a
          # single broken output and hide the rest, which is exactly the signal
          # the per-output fan-out existed to provide. The aggregated verdict is
          # applied at the end, and any failure fails the job.
          set -uo pipefail

          read -r -a build_cmd <<< "${CI_MATRIX_BUILD_COMMAND:-nix build -L --no-link --keep-going --show-trace}"

          rows="$BATCH_TSV"
          if [[ -z "${rows//[[:space:]]/}" ]]; then
            printf -v rows '%s\t%s\t%s' "$BATCH_FALLBACK_NAME" "$BATCH_FALLBACK_ATTR" "$BATCH_FALLBACK_OUTPUT"
          fi

          # Output paths that built successfully, for the check-cache push.
          built_outputs="${RUNNER_TEMP:-/tmp}/ci-built-outputs.txt"
          : > "$built_outputs"

          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          {
            printf '### %s\n\n' "$BATCH_FALLBACK_NAME"
            printf '| flake output | attribute | result |\n'
            printf '| --- | --- | --- |\n'
          } >> "$summary"

          total=0
          passed=0
          failed_names=()

          while IFS=$'\t' read -r out_name out_attr out_path || [[ -n "${out_name:-}" ]]; do
            [[ -n "${out_attr:-}" ]] || continue
            total=$((total + 1))
            echo "::group::Build $out_name (.#$out_attr)"
            if "${build_cmd[@]}" ".#$out_attr"; then
              result='✅ pass'
              passed=$((passed + 1))
              if [[ "${out_path:-}" == /nix/store/* ]]; then
                printf '%s\n' "$out_path" >> "$built_outputs"
              fi
            else
              result='❌ FAIL'
              failed_names+=("$out_name")
            fi
            echo "::endgroup::"
            # The backticks are literal markdown code spans in a printf FORMAT
            # string, not command substitution.
            # shellcheck disable=SC2016
            printf '| `%s` | `%s` | %s |\n' "$out_name" "$out_attr" "$result" >> "$summary"
          done <<< "$rows"

          # A job that resolved no outputs has proved nothing; never let an
          # empty batch masquerade as a green build.
          if [[ "$total" -eq 0 ]]; then
            echo "::error title=Empty build batch::No flake outputs resolved for '$BATCH_FALLBACK_NAME'; refusing to report success for zero work."
            exit 1
          fi

          echo "Attempted $total flake output(s): $passed passed, ${#failed_names[@]} failed."

          if [[ "${#failed_names[@]}" -gt 0 ]]; then
            for out_name in "${failed_names[@]}"; do
              echo "::error title=Flake output build failed::$out_name"
            done
            exit 1
          fi

      # Check results: see the `push-check-caches` input. Deployment targets
      # are excluded here because their own push step below uploads them with
      # a closure-substitutability proof. Runs after a partly failed batch too,
      # so the outputs that did build are not rebuilt next time; only outputs
      # the Build step recorded as passing are pushed. Never fails the job.
      - name: Push check outputs to the Attic cache
        if: >-
          ${{
            !cancelled() && !matrix.noop && !matrix.deploymentTarget &&
            (inputs.push-check-caches == 'true' ||
              (inputs.push-check-caches != 'false' && inputs.push-deployment-caches))
          }}
        continue-on-error: true
        shell: bash
        env:
          ATTIC_CACHE: ${{ vars.ATTIC_CACHE }}
          ATTIC_SUBSTITUTER: ${{ vars.ATTIC_SUBSTITUTER }}
          ATTIC_ENDPOINT: ${{ vars.ATTIC_ENDPOINT }}
          # The push credential, as for the deployment push. Never the pull
          # token: a pull-scoped token cannot upload.
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          set -uo pipefail

          built_outputs="${RUNNER_TEMP:-/tmp}/ci-built-outputs.txt"
          mapfile -t paths < <(sort -u "$built_outputs" 2>/dev/null | grep '^/nix/store/' || true)
          if [[ "${#paths[@]}" -eq 0 ]]; then
            echo "No successfully built outputs to push."
            exit 0
          fi

          missing=()
          for name in ATTIC_TOKEN ATTIC_CACHE ATTIC_SUBSTITUTER; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if [[ "${#missing[@]}" -gt 0 ]]; then
            echo "::warning title=Check cache push skipped::${missing[*]} not set; ${#paths[@]} output(s) will be rebuilt next run"
            exit 0
          fi

          # `nix build --no-link` keeps no GC root; drop any path the store no
          # longer holds rather than failing the whole push on it.
          present=()
          for path in "${paths[@]}"; do
            [[ -e "$path" ]] && present+=("$path")
          done
          if [[ "${#present[@]}" -eq 0 ]]; then
            echo "::warning title=Check cache push skipped::none of the ${#paths[@]} built output(s) is still in the store"
            exit 0
          fi

          endpoint="${ATTIC_ENDPOINT:-}"
          if [[ -z "$endpoint" ]]; then
            endpoint="${ATTIC_SUBSTITUTER%"/$ATTIC_CACHE"}"
          fi
          endpoint="${endpoint%/}/"

          attic=(nix shell --accept-flake-config nixpkgs#attic-client -c attic)
          if ! "${attic[@]}" login --set-default ci-checks "$endpoint" "$ATTIC_TOKEN" >/dev/null; then
            echo "::warning title=Check cache push failed::attic login failed; continuing"
            exit 0
          fi

          printf 'Pushing %d check output(s) to %s:\n' "${#present[@]}" "$ATTIC_CACHE"
          printf '  %s\n' "${present[@]}"
          if timeout --kill-after=30s 900s "${attic[@]}" push "ci-checks:$ATTIC_CACHE" "${present[@]}"; then
            # The backticks are literal markdown code spans.
            # shellcheck disable=SC2016
            {
              printf '### Check cache push\n\n'
              printf 'Pushed %d output(s) to `%s`.\n' "${#present[@]}" "$ATTIC_CACHE"
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          else
            echo "::warning title=Check cache push failed::attic push exited $?; the outputs will be rebuilt next run"
          fi

      # Cache push runs only when the caller requests deployment cache
      # publication.
      # On PR check runs the build itself already validates that the closure
      # is buildable; redoing the push + per-path substitute probe on every
      # matrix job would multiply runtime by 10x — a single NixOS system
      # closure has thousands of paths and the probe's nix-copy fallback
      # has timed out 6h+ jobs in the past (infra#965 first attempt).
      - name: Push deployment closure caches ${{ matrix.name }}
        if: ${{ inputs.push-deployment-caches && !matrix.noop && matrix.deploymentTarget }}
        shell: bash
        env:
          DEPLOY_TARGET: ${{ matrix.name }}
          DEPLOY_SYSTEM: ${{ matrix.system }}
          DEPLOY_KIND: ${{ matrix.deploymentKind }}
          DEPLOY_STORE_PATH: ${{ matrix.output }}
          DEPLOYMENT_CACHE_PUSH_BACKENDS: ${{ inputs.deployment-cache-push-backends }}
          DEPLOYMENT_CACHE_REQUIRED_BACKENDS: ${{ inputs.deployment-cache-required-backends }}
          DEPLOYMENT_CACHE_OPTIONAL_TIMEOUT_SECONDS: ${{ inputs.deployment-cache-optional-timeout-seconds }}
          ATTIC_CACHE: ${{ vars.ATTIC_CACHE }}
          ATTIC_SUBSTITUTER: ${{ vars.ATTIC_SUBSTITUTER }}
          ATTIC_ENDPOINT: ${{ vars.ATTIC_ENDPOINT }}
          ATTIC_TRUSTED_PUBLIC_KEY: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
          DEPLOYMENT_TRUSTED_PUBLIC_KEYS: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          DEPLOYMENT_TRUSTED_SUBSTITUTERS: ${{ vars.SUBSTITUTERS }}
        run: |
          set -u -o pipefail

          mkdir -p .result

          trim_csv_value() {
            local value="$1"
            shopt -s extglob
            value="${value##+([[:space:]])}"
            value="${value%%+([[:space:]])}"
            shopt -u extglob
            printf '%s' "$value"
          }

          backend_is_required() {
            local wanted="$1"
            local required
            IFS=',' read -ra required_backends <<< "$DEPLOYMENT_CACHE_REQUIRED_BACKENDS"
            for required in "${required_backends[@]}"; do
              required="$(trim_csv_value "$required")"
              [[ -n "$required" ]] || continue
              if [[ "$required" == "$wanted" ]]; then
                return 0
              fi
            done
            return 1
          }

          warn_optional_backend() {
            local backend="$1"
            local message="$2"
            echo "::warning title=Optional deployment cache backend::backend=$backend $message"
          }

          require_backend_vars() {
            local backend="$1"
            local required="$2"
            shift 2
            local missing=()
            local name
            for name in "$@"; do
              if [[ -z "${!name:-}" ]]; then
                missing+=("$name")
              fi
            done

            if [[ "${#missing[@]}" -eq 0 ]]; then
              return 0
            fi

            local message
            message="${missing[*]} required when deployment-cache-push-backends includes $backend"
            if [[ "$required" == true ]]; then
              echo "$message" >&2
              exit 1
            fi

            warn_optional_backend "$backend" "$message; continuing without this mirror backend"
            return 1
          }

          run_backend_command() {
            local backend="$1"
            local required="$2"
            local label="$3"
            shift 3
            local exit_code

            if [[ "$required" == true ]]; then
              "$@"
              exit_code=$?
              if [[ "$exit_code" -ne 0 ]]; then
                echo "Required deployment cache backend $backend failed during $label (exit $exit_code)" >&2
                exit "$exit_code"
              fi
              return 0
            fi

            timeout --kill-after=30s "${DEPLOYMENT_CACHE_OPTIONAL_TIMEOUT_SECONDS}s" "$@"
            exit_code=$?
            if [[ "$exit_code" -eq 0 ]]; then
              return 0
            fi

            if [[ "$exit_code" -eq 124 || "$exit_code" -eq 137 || "$exit_code" -eq 143 ]]; then
              warn_optional_backend "$backend" "$label timed out after ${DEPLOYMENT_CACHE_OPTIONAL_TIMEOUT_SECONDS}s; continuing"
            else
              warn_optional_backend "$backend" "$label failed with exit $exit_code; continuing"
            fi
            return "$exit_code"
          }

          if [[ ! "$DEPLOYMENT_CACHE_OPTIONAL_TIMEOUT_SECONDS" =~ ^[1-9][0-9]*$ ]]; then
            echo "deployment-cache-optional-timeout-seconds must be a positive integer" >&2
            exit 1
          fi

          configure_attic_netrc() {
            attic_host="${ATTIC_SUBSTITUTER#http://}"
            attic_host="${attic_host#https://}"
            attic_host="${attic_host%%/*}"
            if [[ -z "$attic_host" ]]; then
              return 1
            fi

            nix_netrc="$HOME/.config/nix/netrc"
            mkdir -p "${nix_netrc%/*}"
            touch "$nix_netrc"
            chmod 0600 "$nix_netrc"

            has_attic_netrc_entry=false
            while read -r kind machine _; do
              if [[ "$kind" == "machine" && "$machine" == "$attic_host" ]]; then
                has_attic_netrc_entry=true
                break
              fi
            done < "$nix_netrc"

            if [[ "$has_attic_netrc_entry" == false ]]; then
              printf 'machine %s password %s\n' "$attic_host" "$ATTIC_TOKEN" >> "$nix_netrc"
            fi
          }

          IFS=',' read -ra backends <<< "$DEPLOYMENT_CACHE_PUSH_BACKENDS"
          for backend in "${backends[@]}"; do
            backend="$(trim_csv_value "$backend")"
            [[ -n "$backend" ]] || continue

            required=false
            if backend_is_required "$backend"; then
              required=true
            fi

            case "$backend" in
              attic)
                if ! require_backend_vars "$backend" "$required" ATTIC_TOKEN ATTIC_CACHE ATTIC_SUBSTITUTER ATTIC_TRUSTED_PUBLIC_KEY; then
                  continue
                fi

                if ! configure_attic_netrc; then
                  if [[ "$required" == true ]]; then
                    echo "Could not derive Attic host from ATTIC_SUBSTITUTER" >&2
                    exit 1
                  fi
                  warn_optional_backend "$backend" "could not derive Attic host from ATTIC_SUBSTITUTER; continuing"
                  continue
                fi

                attic_endpoint="${ATTIC_ENDPOINT:-}"
                if [[ -z "$attic_endpoint" ]]; then
                  attic_cache_suffix="/$ATTIC_CACHE"
                  attic_endpoint="${ATTIC_SUBSTITUTER%"$attic_cache_suffix"}"
                fi
                attic_endpoint="${attic_endpoint%/}/"
                if ! run_backend_command "$backend" "$required" "attic login" \
                  nix shell nixpkgs#attic-client -c \
                    attic login --set-default deployment "$attic_endpoint" "$ATTIC_TOKEN"
                then
                  continue
                fi

                cache="$ATTIC_CACHE"
                substituter="$ATTIC_SUBSTITUTER"
                ;;
              none)
                cache="none"
                substituter=""
                ;;
              *)
                echo "Unsupported deployment cache backend: $backend" >&2
                exit 1
                ;;
            esac

            trusted_args=()
            for key in $DEPLOYMENT_TRUSTED_PUBLIC_KEYS; do
              trusted_args+=(--trusted-public-key "$key")
            done
            if [[ "$backend" == attic ]]; then
              trusted_args+=(--trusted-public-key "$ATTIC_TRUSTED_PUBLIC_KEY")
            fi

            substituter_args=()
            if [[ -n "$substituter" ]]; then
              substituter_args+=(--substituter "$substituter" --require-substitute)
            fi
            if [[ "$backend" != attic ]]; then
              # Probe across every trusted substituter that target hosts
              # configure (deployment cache + auxiliary caches +
              # cache.nixos.org). The integrity check passes if ANY trusted
              # substituter resolves a path — matching the realistic deploy
              # environment instead of demanding exhaustive coverage on the
              # primary cache. Attic is excluded because its required proof
              # must show the Attic backend itself covers the closure.
              for extra_substituter in $DEPLOYMENT_TRUSTED_SUBSTITUTERS https://cache.nixos.org; do
                [[ "$extra_substituter" == "$substituter" ]] && continue
                substituter_args+=(--substituter "$extra_substituter")
              done
              # cache.nixos.org's signing key is universally trusted on NixOS
              # hosts; add it to the probe's trusted-public-keys list so
              # nix copy --from cache.nixos.org accepts the signatures.
              trusted_args+=(--trusted-public-key
                "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=")
            fi

            if ! run_backend_command "$backend" "$required" "cache push and substitute probe" \
              ${{ needs.compute-mcl-ref.outputs.mcl_flake_cmd }} -- cache push-closure \
              --backend "$backend" \
              --cache "$cache" \
              --target "$DEPLOY_TARGET" \
              --system "$DEPLOY_SYSTEM" \
              --kind "$DEPLOY_KIND" \
              --transport attic-ci \
              --event-log .result/deployment-cache-push-events.jsonl \
              "${substituter_args[@]}" \
              "${trusted_args[@]}" \
              "$DEPLOY_STORE_PATH"
            then
              continue
            fi
          done

      - uses: actions/upload-artifact@v7
        if: ${{ always() && inputs.push-deployment-caches && !matrix.noop && matrix.deploymentTarget }}
        continue-on-error: true
        with:
          name: deployment-cache-push-${{ github.run_id }}-${{ strategy.job-index }}
          path: .result/deployment-cache-push-events.jsonl
          if-no-files-found: warn
          retention-days: 1

      # In-house S3 mirror of the same artifact, over the NetBird VPN, using a
      # bucket-scoped CI credential (the Attic-token analog). STRICTLY
      # NON-BLOCKING: every failure is swallowed so a store/VPN hiccup can
      # never fail CI. Skipped entirely when the credential is absent (e.g.
      # forks / repos not yet onboarded). Object key namespaces by run + job so
      # a fetch is deterministic, and the store's `ci-artifacts` lifecycle
      # (retention-days: 1) reaps it just like the GitHub artifact.
      - name: Upload CI artifacts to S3 (non-blocking mirror)
        if: ${{ always() && inputs.push-deployment-caches && !matrix.noop && matrix.deploymentTarget }}
        continue-on-error: true
        shell: bash
        env:
          MCL_S3_ARTIFACTS_ENDPOINT: ${{ vars.MCL_S3_ARTIFACTS_ENDPOINT }}
          MCL_S3_ARTIFACTS_BUCKET: ${{ vars.MCL_S3_ARTIFACTS_BUCKET }}
          MCL_S3_ARTIFACTS_REGION: ${{ vars.MCL_S3_ARTIFACTS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.MCL_S3_ARTIFACTS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MCL_S3_ARTIFACTS_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
          S3_OBJECT_PREFIX: deployment-cache-push/${{ github.run_id }}/${{ strategy.job-index }}
        run: |
          set -u
          if [[ -z "${AWS_ACCESS_KEY_ID:-}" || -z "${AWS_SECRET_ACCESS_KEY:-}" || -z "${MCL_S3_ARTIFACTS_ENDPOINT:-}" ]]; then
            echo "S3 artifact store not configured for this repo; skipping mirror."
            exit 0
          fi
          [[ -f .result/deployment-cache-push-events.jsonl ]] || { echo "no artifact to mirror."; exit 0; }
          region="${MCL_S3_ARTIFACTS_REGION:-garage}"
          bucket="${MCL_S3_ARTIFACTS_BUCKET:-ci-artifacts}"
          if nix shell nixpkgs#awscli2 -c \
              aws --endpoint-url "$MCL_S3_ARTIFACTS_ENDPOINT" --region "$region" \
                  s3 cp .result/deployment-cache-push-events.jsonl \
                  "s3://$bucket/$S3_OBJECT_PREFIX/deployment-cache-push-events.jsonl"; then
            echo "Mirrored deployment-cache-push-events.jsonl to s3://$bucket/$S3_OBJECT_PREFIX/"
          else
            echo "::warning title=S3 artifact mirror::upload failed (non-blocking); continuing"
          fi

      # Release the roots taken by `Root the flake source for this job`. The
      # daemon's gcroots/auto entries point at these symlinks, so removing the
      # symlinks is what makes the sources collectable again. RUNNER_TEMP is
      # also emptied between jobs, but a persistent runner should not hold the
      # roots any longer than the job that needed them.
      - name: Release the flake source roots
        if: ${{ always() && !matrix.noop }}
        continue-on-error: true
        shell: bash
        run: |
          root_dir="${RUNNER_TEMP:-/tmp}/flake-source-roots"
          [[ -d "$root_dir" ]] || exit 0
          find "$root_dir" -mindepth 1 -maxdepth 1 \( -type l -o -name "*.json" -o -name "*.tsv" -o -name "*.txt" \) -delete
          rmdir "$root_dir" 2>/dev/null || true

  results:
    runs-on: ${{ fromJSON(inputs.results-runner) }}
    name: Final Results
    needs:
      [compute-mcl-ref, build, shard-matrix, merge-matrices, plan-build-matrix]
    # Report upstream failures while the run is active; cancellation must not
    # allocate a final reporting runner and retain the caller's concurrency slot.
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Setup Nix
        uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        with:
          push-to-cache: false
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.NIX_GITHUB_TOKEN || secrets.GH_READ_METACRAFT_PRIVATE_REPOS || github.token }}
          nix-gitlab-token: ${{ secrets.NIX_GITLAB_TOKEN }}
          nix-gitlab-domain: ${{ vars.NIX_GITLAB_DOMAIN }}
          # Nix reads a private cache through netrc, and setup-nix writes netrc
          # in its own `Configure Nix` step — BEFORE `Probe binary caches`.
          # Passing the pull token here is what lets that probe authenticate.
          # Without it the probe gets HTTP 401 and probe-substituters.sh REMOVES
          # the private cache from nix.conf for the remainder of the job, so
          # every path only that cache holds is rebuilt from source. The
          # standalone netrc step that follows runs after the probe, and it only
          # writes netrc — it cannot restore an already-dropped substituter.
          #
          # Uploads stay off: `Start Attic watch-store` also requires
          # `attic-cache`, which no job here passes, and push-to-cache is false.
          attic-token: ${{ secrets.ATTIC_PULL_TOKEN || secrets.ATTIC_TOKEN }}

      - name: Print CI Matrix
        env:
          IS_INITIAL: 'false'
          # Server closures are uploaded only on a push to live/main. A miss
          # is unexpected only after that upload. Pull requests leave this false.
          EXPECT_DEPLOYMENT_PUBLISHED: ${{ inputs.push-deployment-caches && 'true' || 'false' }}
          EXTRA_CACHE_URLS: ${{ vars.SUBSTITUTERS }}
          ATTIC_SUBSTITUTER: ${{ vars.ATTIC_SUBSTITUTER }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_PULL_TOKEN || secrets.ATTIC_TOKEN }}
        # Passed as a file, see "Generate CI matrix comment".
        run: |
          matrix_file="$RUNNER_TEMP/precalc-matrix.json"
          cat > "$matrix_file" <<'MCL_PRECALC_MATRIX_EOF'
          ${{
            needs.merge-matrices.result == 'success' &&
            needs.merge-matrices.outputs.full_matrix ||
            needs.shard-matrix.outputs.full_matrix
          }}
          MCL_PRECALC_MATRIX_EOF
          PRECALC_MATRIX="@$matrix_file" ${{ needs.compute-mcl-ref.outputs.mcl_flake_cmd }} print-table

      - name: Update GitHub Comment
        uses: metacraft-labs/devops-modules/.github/sticky-comment@dev
        with:
          # One comment per call: a split caller's calls each report their own systems.
          key: ${{ inputs.build-systems }}
          path: comment.md

      - run: exit 1
        if: >-
          (
            (
              needs.merge-matrices.result == 'success' &&
              needs.merge-matrices.outputs.build_matrix != '{"include":[]}'
            ) ||
              needs.shard-matrix.outputs.build_matrix != '{"include":[]}'
          ) && (
            contains(needs.*.result, 'failure') ||
            contains(needs.*.result, 'cancelled')
          )
