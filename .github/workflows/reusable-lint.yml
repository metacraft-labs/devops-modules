name: 'Lint'

# Runs a repository's pre-commit / prek hook suite.
#
# HOW THE HOOK ENTRY POINT IS FOUND
#
# Repositories expose their hooks in several shapes: a dedicated
# `devShells.<system>.pre-commit` shell carrying prek, a git-hooks.nix
# `checks.<system>.pre-commit-check` (or `.pre-commit`) derivation, a dev shell
# whose shellHook writes the (usually gitignored) `.pre-commit-config.yaml`
# symlink and carries prek or pre-commit, or a plain committed
# `.pre-commit-config.yaml`. With no inputs set, the first match below wins:
#
#   1. devShells.<system>.pre-commit      -> `prek run --all-files` in it
#                                            (the original behaviour, unchanged)
#   2. devShells.<system>.hooks, .lint, .default, in that order -> enter the
#      shell; if it then provides a `.pre-commit-config.yaml` and prek (or
#      pre-commit), run it with `--all-files`; otherwise try the next shell
#   3. checks.<system>.pre-commit-check   -> `nix build` the check (hermetic,
#      checks.<system>.pre-commit            but sandboxed hooks lack the dev
#                                            shell's tools, hence after 2)
#   4. a committed `.pre-commit-config.yaml` -> `prek` from nixpkgs
#
# The new tiers pass --no-write-lock-file so a stale flake.lock is not
# rewritten mid-run and then reported by the hooks as a modified file.
#
# If nothing matches, the job FAILS with the list of what was probed — a repo
# wired to this workflow must never pass by running nothing.
#
# Overrides, for repos where discovery needs help:
#   check:   run only `nix build .#checks.<system>.<check>`
#   shell:   run only in `devShells.<system>.<shell>` (with `command`, or the
#            auto hook runner when `command` is empty)
#   command: a bash command; run inside `shell` when that is set, otherwise
#            directly in the checkout (it may invoke nix itself)
#
# CROSS-REPO SIBLINGS AND SUBMODULES
#
# Hooks often read files outside the repository: a `just lint` that compiles
# against `../nim-pty`, a flake whose dev shell points into a submodule. So
# before the hooks run, this workflow materializes:
#
#   * the repo's reprobuild DEVELOP SET, at the revisions its committed
#     `repro.lock` pins (input `develop-set`, default `auto`). WHICH repos at
#     WHICH revisions and WHERE is answered by the `repro` CLI itself
#     (`repro develop --all --dry-run --json`, read-only) — the tool that owns
#     the lock format — built from the org's single reprobuild pin (the
#     `reprobuild` input of devops-modules' flake, served from the binary
#     cache). Each node is then fetched at its exact 40-hex revision with
#     plain git, at the path repro reports (`../<name>` by default). Placement
#     is done by git rather than by `repro develop --all` because that command
#     first clones the lock's ADVISORY `ref` branch and fails outright when
#     that branch is not on the remote — common, since the pre-push gate
#     records the pusher's local branch name — even though the pinned commit
#     is there.
#     `auto` installs and clones nothing when there is no `repro.lock` or it
#     pins no sibling (every deps entry is `path = "."`, the repo itself).
#   * git submodules, recursively, when `.gitmodules` is tracked (input
#     `submodules`, default `auto`).
#
# Both authenticate with the same token as setup-nix (NIX_GITHUB_TOKEN, else
# GH_READ_METACRAFT_PRIVATE_REPOS), passed as a per-command HTTP header and
# never written into any .git/config.
#
# The discovery step, and the sibling / submodule steps, are exercised
# hermetically by checks/ci-workflows.nix (`reusable-lint-hook-discovery`).

on:
  # Allow this workflow to be reused by other workflows:
  workflow_call:
    inputs:
      runner:
        description: 'JSON-encoded runner label set (RC1 capability labels, e.g. ["self-hosted","linux","x64"])'
        default: '["self-hosted","linux","x64"]'
        required: false
        type: string
      shell:
        description: 'Dev shell to run the hooks in (devShells.<system>.<shell>); empty = discover'
        default: ''
        required: false
        type: string
      check:
        description: 'Flake check to build instead (checks.<system>.<check>), e.g. a git-hooks.nix pre-commit-check; empty = discover'
        default: ''
        required: false
        type: string
      command:
        description: 'Bash command to run (inside `shell` if set, else in the checkout); empty = the auto hook runner'
        default: ''
        required: false
        type: string
      develop-set:
        description: 'Materialize the reprobuild develop set (the siblings the committed repro.lock pins) before the hooks: auto (when repro.lock pins a sibling) | off'
        default: 'auto'
        required: false
        type: string
      submodules:
        description: 'Initialize git submodules recursively before the hooks: auto (when .gitmodules is tracked) | off'
        default: 'auto'
        required: false
        type: string
      fetch-depth:
        description: 'actions/checkout fetch-depth (0 = full history, for flakes that cannot evaluate from a shallow clone)'
        default: 1
        required: false
        type: number

    secrets:
      NIX_GITHUB_TOKEN:
        description: GitHub token to add as access-token in nix.conf
        required: false
      GH_READ_METACRAFT_PRIVATE_REPOS:
        description: 'Legacy org-wide read token used only when NIX_GITHUB_TOKEN is unset (optional)'
        required: false
      NIX_GITLAB_TOKEN:
        description: GitLab token to add as access-token in nix.conf
        required: false

jobs:
  lint:
    runs-on: ${{ fromJSON(inputs.runner) }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Setup Nix
        uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        with:
          push-to-cache: false
          nix-github-token: ${{ secrets.NIX_GITHUB_TOKEN || secrets.GH_READ_METACRAFT_PRIVATE_REPOS }}
          nix-gitlab-token: ${{ secrets.NIX_GITLAB_TOKEN }}
          nix-gitlab-domain: ${{ vars.NIX_GITLAB_DOMAIN }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}

      - name: Initialize submodules
        env:
          LINT_SUBMODULES: ${{ inputs.submodules }}
          LINT_GIT_TOKEN: ${{ secrets.NIX_GITHUB_TOKEN || secrets.GH_READ_METACRAFT_PRIVATE_REPOS }}
        run: |
          set -euo pipefail
          case "$LINT_SUBMODULES" in
            auto) ;;
            off) echo "reusable-lint: submodules: off"; exit 0 ;;
            *) echo "::error title=reusable-lint::'submodules' must be auto or off (got '$LINT_SUBMODULES')"; exit 1 ;;
          esac
          if ! git ls-files --error-unmatch .gitmodules >/dev/null 2>&1; then
            echo "reusable-lint: no tracked .gitmodules; nothing to initialize"
            exit 0
          fi
          # The token travels as a one-command HTTP header: the empty value
          # first RESETS any header actions/checkout persisted (two
          # Authorization headers are rejected), and `git -c` reaches the
          # nested clones through GIT_CONFIG_PARAMETERS. SSH-style URLs are
          # rewritten to https so the same header applies.
          auth=(-c "url.https://github.com/.insteadOf=git@github.com:"
            -c "url.https://github.com/.insteadOf=ssh://git@github.com/")
          if [ -n "$LINT_GIT_TOKEN" ]; then
            basic=$(printf 'x-access-token:%s' "$LINT_GIT_TOKEN" | base64 | tr -d '\n')
            echo "::add-mask::$basic"
            auth+=(-c "http.https://github.com/.extraheader="
              -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic")
          fi
          echo "reusable-lint: + git submodule update --init --recursive"
          git "${auth[@]}" submodule update --init --recursive
          git submodule status --recursive

      - name: Materialize the develop set
        env:
          LINT_DEVELOP_SET: ${{ inputs.develop-set }}
          LINT_GIT_TOKEN: ${{ secrets.NIX_GITHUB_TOKEN || secrets.GH_READ_METACRAFT_PRIVATE_REPOS }}
          # The org's single reprobuild pin lives in devops-modules' flake
          # (`inputs.reprobuild`); reading it from there keeps this `repro`
          # the one the fleet runs, with no second pin to drift.
          LINT_REPRO_FLAKE: github:metacraft-labs/devops-modules/dev
        run: |
          # Actions runs this with `bash -e`; every failure below is handled
          # explicitly (probing commands are allowed to fail).
          set +e -uo pipefail
          die() {
            echo "::error title=reusable-lint develop-set::$*"
            exit 1
          }
          case "$LINT_DEVELOP_SET" in
            auto) ;;
            off) echo "reusable-lint: develop-set: off"; exit 0 ;;
            *) die "'develop-set' must be auto or off (got '$LINT_DEVELOP_SET')" ;;
          esac
          if [ ! -f repro.lock ]; then
            echo "reusable-lint: no repro.lock; no develop set to materialize"
            exit 0
          fi

          # Static pre-check (no tool needed): does the lock pin any sibling,
          # i.e. a deps entry whose path is not "." (the repo itself)? If not,
          # nothing is installed and nothing is cloned.
          deps_line=""
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in 'deps = ['*) deps_line="$line" ;; esac
          done <repro.lock
          siblings=0
          rest="$deps_line"
          while :; do
            case "$rest" in
              *'path = "'*)
                rest="${rest#*path = \"}"
                [ "${rest%%\"*}" = "." ] || siblings=$((siblings + 1))
                ;;
              *) break ;;
            esac
          done
          if [ "$siblings" -eq 0 ]; then
            echo "reusable-lint: repro.lock pins no sibling (root-only); no develop set to materialize"
            exit 0
          fi

          # The repro CLI decides the set: it owns the lock format.
          if command -v repro >/dev/null 2>&1; then
            repro=repro
          else
            echo "reusable-lint: + nix build (the reprobuild pinned by $LINT_REPRO_FLAKE)"
            # shellcheck disable=SC2016
            outs=$(nix build --no-link --print-out-paths --impure --accept-flake-config --expr \
              '(builtins.getFlake (builtins.getEnv "LINT_REPRO_FLAKE")).inputs.reprobuild.packages.${builtins.currentSystem}.reprobuild') ||
              die "could not build the pinned repro CLI from $LINT_REPRO_FLAKE"
            repro=""
            while IFS= read -r o; do
              [ -x "$o/bin/repro" ] && repro="$o/bin/repro" && break
            done <<<"$outs"
            [ -n "$repro" ] || die "the pinned reprobuild package has no bin/repro (outputs: $outs)"
          fi
          err=$(mktemp)
          json=$("$repro" develop --all --dry-run --json 2>"$err")
          rc=$?
          echo "::group::repro develop --all --dry-run --json (exit $rc)"
          printf '%s\n' "$json"
          cat "$err"
          echo "::endgroup::"
          rm -f "$err"

          # Read the nodes out of the pretty-printed document (no jq on the
          # runner is assumed). Unparseable output fails closed below.
          names=() paths=() revs=() oks=()
          n=-1
          in_nodes=0
          doc_exit=""
          while IFS= read -r line || [ -n "$line" ]; do
            t="${line#"${line%%[![:space:]]*}"}"
            t="${t%,}"
            if [ "$in_nodes" -eq 1 ]; then
              case "$t" in
                ']') in_nodes=0; continue ;;
                '"node": "'*) n=$((n + 1)); v="${t#*: \"}"; names[n]="${v%\"}"; paths[n]=""; revs[n]=""; oks[n]="" ;;
                '"path": "'*) v="${t#*: \"}"; paths[n]="${v%\"}" ;;
                '"revision": "'*) v="${t#*: \"}"; revs[n]="${v%\"}" ;;
                '"ok": '*) oks[n]="${t#*: }" ;;
              esac
              continue
            fi
            case "$t" in
              '"nodes": [') in_nodes=1 ;;
              '"exitCode": '*) doc_exit="${t#*: }" ;;
            esac
          done <<<"$json"
          count=$((n + 1))
          [ "$rc" -eq 0 ] && [ "$doc_exit" = "0" ] ||
            die "repro could not resolve the develop set from repro.lock (exit $rc, document exitCode '${doc_exit:-none}'); see the group above"
          [ "$count" -gt 0 ] ||
            die "repro.lock pins $siblings sibling(s) but repro resolved none; see the group above"

          auth=()
          if [ -n "$LINT_GIT_TOKEN" ]; then
            basic=$(printf 'x-access-token:%s' "$LINT_GIT_TOKEN" | base64 | tr -d '\n')
            echo "::add-mask::$basic"
            auth=(-c "http.https://github.com/.extraheader="
              -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic")
          fi
          here=$(pwd -P)
          for ((i = 0; i < count; i++)); do
            name="${names[i]}" path="${paths[i]}" rev="${revs[i]}"
            [ "${oks[i]}" = "true" ] || die "repro rejected develop-set node '$name'; see the group above"
            [ "${#rev}" -eq 40 ] && [ -z "${rev//[0-9a-f]/}" ] ||
              die "node '$name' is not pinned to an exact 40-hex revision ('$rev')"
            case "$path" in
              /*) ;;
              *) die "node '$name' has no absolute placement path ('$path')" ;;
            esac
            case "$here/" in
              "$path"/*) die "node '$name' would be placed at '$path', which contains this checkout" ;;
            esac
            # The clone URL is the lock's own `url` for this entry.
            entry="${deps_line#*"{ name = \"$name\", "}"
            [ "$entry" != "$deps_line" ] || die "node '$name' has no deps entry in repro.lock"
            entry="${entry%%\}*}"
            case "$entry" in
              *'url = "'*) url="${entry#*url = \"}"; url="${url%%\"*}" ;;
              *) die "the repro.lock entry for '$name' carries no url" ;;
            esac
            echo "reusable-lint: develop-set $name @ $rev -> $path ($url)"
            if [ -e "$path" ] && [ ! -e "$path/.git" ]; then
              die "'$path' exists and is not a git checkout; refusing to overwrite it"
            fi
            [ -e "$path/.git" ] || git init -q "$path" || die "git init $path failed"
            git -C "$path" remote remove origin >/dev/null 2>&1
            if ! { git -C "$path" remote add origin "$url" &&
              git "${auth[@]}" -C "$path" fetch -q --depth 1 origin "$rev" &&
              git -C "$path" checkout -q --force --detach "$rev" &&
              git -C "$path" clean -qffdx; }; then
              die "could not fetch '$name' at $rev from $url"
            fi
            [ "$(git -C "$path" rev-parse HEAD)" = "$rev" ] || die "'$name' did not land on $rev"
          done
          echo "reusable-lint: materialized $count develop-set sibling(s) from repro.lock"

      - name: Check formatting
        env:
          LINT_SHELL: ${{ inputs.shell }}
          LINT_CHECK: ${{ inputs.check }}
          LINT_COMMAND: ${{ inputs.command }}
        run: |
          # Actions runs this with `bash -e`; exit codes are handled
          # explicitly below (NO_ENTRY must not abort the discovery loop).
          set +e -uo pipefail

          # Exit code the in-shell runner uses for "this shell has no hook
          # entry point" (as opposed to "the hooks ran and failed").
          NO_ENTRY=97
          runner_flags=(run --all-files --show-diff-on-failure --color always)
          probed=()

          die() {
            echo "::error title=reusable-lint::$*"
            exit 1
          }

          run_logged() {
            echo "reusable-lint: + $*"
            "$@"
          }

          # Runs inside a dev shell, after its shellHook: the shellHook of a
          # git-hooks.nix shell is what writes the gitignored config symlink.
          # shellcheck disable=SC2016
          auto_runner='
            if [ ! -e .pre-commit-config.yaml ]; then
              echo "reusable-lint: no .pre-commit-config.yaml after entering the shell" >&2
              exit 97
            fi
            if command -v prek >/dev/null 2>&1; then
              exec prek "$@"
            elif command -v pre-commit >/dev/null 2>&1; then
              exec pre-commit "$@"
            fi
            echo "reusable-lint: the shell provides neither prek nor pre-commit" >&2
            exit 97
          '

          # attr_names <flake output> -> space-separated attribute names of
          # <output>.<system>, empty when the output is absent.
          attr_names() {
            local out err
            err=$(mktemp)
            if out=$(nix eval --raw --no-write-lock-file --accept-flake-config ".#$1.$system" \
                --apply 'a: builtins.concatStringsSep " " (builtins.attrNames a)' 2>"$err"); then
              echo "$out"
            else
              if ! grep -q 'does not provide attribute' "$err"; then
                echo "::warning title=reusable-lint::evaluating .#$1.$system failed:" >&2
                cat "$err" >&2
              fi
            fi
            rm -f "$err"
          }

          has() { [[ " $1 " == *" $2 "* ]]; }

          run_check() {
            run_logged nix build -L --no-link --no-write-lock-file --accept-flake-config ".#checks.$system.$1"
          }

          # run_in_shell <shell> -> runs LINT_COMMAND or the auto runner;
          # returns NO_ENTRY when the shell carries no hook entry point.
          run_in_shell() {
            if [ -n "$LINT_COMMAND" ]; then
              run_logged nix develop --no-write-lock-file --accept-flake-config ".#$1" -c bash -euo pipefail -c "$LINT_COMMAND"
            else
              run_logged nix develop --no-write-lock-file --accept-flake-config ".#$1" -c bash -c "$auto_runner" reusable-lint "${runner_flags[@]}"
            fi
          }

          system=$(nix eval --raw --impure --expr builtins.currentSystem) ||
            die "cannot determine the Nix system"

          # ---- explicit overrides -------------------------------------------
          if [ -n "$LINT_CHECK" ] && [ -n "$LINT_SHELL" ]; then
            die "set at most one of the 'check' and 'shell' inputs"
          fi
          if [ -n "$LINT_CHECK" ]; then
            [ -z "$LINT_COMMAND" ] || die "'command' cannot be combined with 'check'"
            run_check "$LINT_CHECK"
            exit
          fi
          if [ -n "$LINT_SHELL" ]; then
            run_in_shell "$LINT_SHELL"
            rc=$?
            [ "$rc" -ne "$NO_ENTRY" ] || die "devShells.$system.$LINT_SHELL (the 'shell' input) provides no hook entry point: it needs a .pre-commit-config.yaml after its shellHook and prek or pre-commit on PATH — or set 'command'"
            exit "$rc"
          fi
          if [ -n "$LINT_COMMAND" ]; then
            run_logged bash -euo pipefail -c "$LINT_COMMAND"
            exit
          fi

          # ---- discovery ------------------------------------------------------
          shells=""
          checks=""
          if [ -f flake.nix ]; then
            shells=$(attr_names devShells)
          else
            probed+=("no flake.nix")
          fi

          # 1. The dedicated pre-commit shell (original behaviour).
          if has "$shells" pre-commit; then
            run_logged nix develop --accept-flake-config .#pre-commit -c prek "${runner_flags[@]}"
            exit
          fi
          probed+=("devShells.$system.pre-commit")

          # 2. A dev shell that sets the hooks up — where a developer's commit
          #    runs them. Preferred over the check derivation below because
          #    git-hooks.nix `language: system` hooks routinely call tools
          #    (just, nimble, cargo, ...) that only the dev shell provides and
          #    the build sandbox does not.
          for s in hooks lint default; do
            if has "$shells" "$s"; then
              run_in_shell "$s"
              rc=$?
              [ "$rc" -eq "$NO_ENTRY" ] || exit "$rc"
              probed+=("devShells.$system.$s (no hook config/runner inside)")
            else
              probed+=("devShells.$system.$s")
            fi
          done

          # 3. A git-hooks.nix check derivation. (`checks` is probed only now:
          #    evaluating its names can be slow.)
          if [ -f flake.nix ]; then
            checks=$(attr_names checks)
          fi
          for c in pre-commit-check pre-commit; do
            if has "$checks" "$c"; then
              run_check "$c"
              exit
            fi
            probed+=("checks.$system.$c")
          done

          # 4. A committed config, run with prek from nixpkgs.
          if [ -f .pre-commit-config.yaml ] && git ls-files --error-unmatch .pre-commit-config.yaml >/dev/null 2>&1; then
            run_logged nix run --accept-flake-config nixpkgs#prek -- "${runner_flags[@]}"
            exit
          fi
          probed+=("committed .pre-commit-config.yaml")

          die "no hook entry point found (probed: $(IFS=';'; echo "${probed[*]}")). Expose devShells.<system>.pre-commit or checks.<system>.pre-commit-check, or set the 'shell' / 'check' / 'command' input."
