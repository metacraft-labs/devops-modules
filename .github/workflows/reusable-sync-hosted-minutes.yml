# RD3 companion cron — write the org's remaining included-minutes verdict into
# the `GH_HOSTED_OK` org Actions variable, so `reusable-choose-runner.yml` can
# decide hosted-vs-self-hosted for free (no per-run billing API call, no admin
# token in every workflow — research-github-free-ci-hybrid.md §3.4).
#
# Campaign: Runner-Fleet-Capability-Pools-And-Remote-Driving, milestone RD3.
#
# This is a REUSABLE workflow (workflow_call). A `schedule:` trigger must live in
# the repo it runs in, so an ops repo wraps it:
#
#   # .github/workflows/sync-hosted-minutes.yml  (in an ops repo, per org)
#   name: sync-hosted-minutes
#   on:
#     schedule: [{ cron: '*/30 * * * *' }]
#     workflow_dispatch:
#   jobs:
#     sync:
#       uses: metacraft-labs/devops-modules/.github/workflows/reusable-sync-hosted-minutes.yml@dev
#       with:
#         org: metacraft-labs
#         min_minutes_remaining: 300
#         included_minutes: 3000   # Team; Enterprise 50000 + `enterprise: <slug>`
#       secrets:
#         billing_token: ${{ secrets.ORG_BILLING_READ_TOKEN }}
#         variables_token: ${{ secrets.ORG_VARIABLES_WRITE_TOKEN }}
#
# Tokens (operator prerequisite):
#   * billing_token   — billing READ (org: classic PAT admin:org, or a GitHub
#                       App install token with org billing:read; enterprise
#                       scope: manage_billing:enterprise). Reads the enhanced
#                       usage report (GET /organizations/{org}/settings/billing/usage
#                       or /enterprises/{ent}/...) — the classic
#                       /orgs/{org}/settings/billing/actions endpoint is HTTP 410.
#
# FAIL-SAFE: any billing read failure writes GH_HOSTED_OK=false. The job runs on
# free ubuntu-latest only in a PUBLIC wrapper repo, else on the self-hosted
# `runner` array (a private repo's hosted job cannot start once the pool is
# exhausted, which would freeze GH_HOSTED_OK=true exactly when it must flip).
#   * variables_token — org VARIABLES write (fine-grained: Organization
#                       "Variables" read/write). Writes GH_HOSTED_OK.
#     GITHUB_TOKEN cannot do either, so both are required secrets.

name: sync-hosted-minutes

on:
  workflow_call:
    inputs:
      org:
        description: 'The organization whose included minutes gate GH_HOSTED_OK.'
        type: string
        required: true
      min_minutes_remaining:
        description: 'Flip GH_HOSTED_OK to false once remaining minutes drop below this buffer.'
        type: number
        default: 300
      included_minutes:
        description: >-
          Included-minutes POOL in Linux-equivalent minutes (Team org 3000;
          Enterprise 50000 shared by its orgs — set `enterprise` too).
        type: number
        default: 3000
      enterprise:
        description: 'Enterprise slug whose pooled billing to read (enterprise-plan orgs). Empty = org scope.'
        type: string
        default: ''
      runner:
        description: 'Self-hosted label array (JSON) used when the calling repo is not public.'
        type: string
        default: '["self-hosted","linux","x64"]'
    secrets:
      billing_token:
        description: 'Org billing-read token.'
        required: true
      variables_token:
        description: 'Org variables-write token (may equal billing_token if it has both scopes).'
        required: true

jobs:
  sync:
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'public' && '["ubuntu-latest"]' || inputs.runner) }}
    steps:
      - id: compute
        env:
          GH_TOKEN: ${{ secrets.billing_token }}
          ORG: ${{ inputs.org }}
          MIN_REMAIN: ${{ inputs.min_minutes_remaining }}
          INCLUDED_MINUTES: ${{ inputs.included_minutes }}
          BILLING_ENTERPRISE: ${{ inputs.enterprise }}
        run: |
          # No `set -e`: a billing failure must write GH_HOSTED_OK=false, not
          # abort and leave a stale `true` behind.
          set -uo pipefail

          # >>> billing-remaining — SHARED, keep byte-identical in reusable-manage-runner-mode.yml,
          # reusable-choose-runner.yml and reusable-sync-hosted-minutes.yml (t_runner_mode_manager
          # fails if the three copies drift).
          #
          # billing_remaining: print "<remaining>|<billed>" for the CURRENT billing month and
          # exit 0, or exit non-zero on ANY unreachable / unparseable / ambiguous read, so
          # the caller fails safe to self-hosted.
          #   remaining — included Actions minutes left in the pool, in LINUX-EQUIVALENT
          #               minutes (integer, may be negative once exhausted).
          #   billed    — USD net-billed for Actions MINUTES this month (overage).
          # Env: ORG; INCLUDED_MINUTES (the pool: Team org 3000, Enterprise 50000);
          #      BILLING_ENTERPRISE (optional enterprise slug — the POOLED scope).
          #
          # The classic GET /orgs/{org}/settings/billing/actions endpoint returns HTTP 410
          # since GitHub's enhanced-billing migration. The enhanced usage report is the
          # source now; it has no "included minutes remaining" field, so it is DERIVED:
          #   * The included allowance is a DOLLAR pool — INCLUDED_MINUTES x the Linux
          #     2-core per-minute price — drawn down by each SKU's gross price, not by the
          #     old 1x/2x/10x minute multipliers. (Measured on live data 2026-09: an
          #     enterprise pool stopped jobs at $300.87 gross = 50000 x $0.006 after 34005
          #     raw minutes, having run on past the point a 2x Windows multiplier would
          #     have exhausted it; a Team org stopped at exactly $18.00 = 3000 x $0.006.)
          #   * The report's discount mixes the (free, unlimited) public-repo usage with
          #     the included-pool usage, so the pool draw is the GROSS of every minutes
          #     row NOT in a public repo. A repo that is not listed as public (private,
          #     internal, deleted, renamed) counts against the pool: conservative.
          #   * An enterprise-plan org draws on a pool SHARED by every org of its
          #     enterprise, and its org-scoped report shows only its own share — so an
          #     org scope on an enterprise-plan org is ambiguous and fails safe; read the
          #     enterprise scope (BILLING_ENTERPRISE) instead.
          billing_remaining() (
            set -uo pipefail
            hdr='X-GitHub-Api-Version: 2022-11-28'
            [ "${INCLUDED_MINUTES:-}" -ge 0 ] 2>/dev/null \
              || { echo "billing: INCLUDED_MINUTES='${INCLUDED_MINUTES:-}' is not a non-negative integer" >&2; exit 1; }
            year="$(date -u +%Y)" || exit 1
            month="$(date -u +%m)" || exit 1
            month="${month#0}"
            if [ -n "${BILLING_ENTERPRISE:-}" ]; then
              path="/enterprises/${BILLING_ENTERPRISE}/settings/billing/usage?year=${year}&month=${month}"
            else
              plan="$(gh api -H "$hdr" "/orgs/${ORG}" --jq '.plan.name // ""')" || exit 1
              if [ "$plan" = "enterprise" ]; then
                echo "billing: ${ORG} is on an enterprise plan (pooled minutes); set the enterprise scope" >&2
                exit 1
              fi
              path="/organizations/${ORG}/settings/billing/usage?year=${year}&month=${month}"
            fi
            usage="$(gh api -H "$hdr" "$path")" || exit 1
            printf '%s' "$usage" | jq -e '.usageItems | type == "array"' >/dev/null \
              || { echo "billing: usage report has no usageItems array" >&2; exit 1; }
            orgs="$(printf '%s' "$usage" | jq -r --arg org "$ORG" \
              '[.usageItems[] | select((.unitType // "" | ascii_downcase) == "minutes")
                | (.organizationName // $org)] | unique | .[]')" || exit 1
            public='[]'
            for o in $orgs; do
              names="$(gh api --paginate -H "$hdr" "/orgs/${o}/repos?type=public&per_page=100" \
                --jq '.[].name')" || exit 1
              public="$(printf '%s\n' "$names" | jq -R -s --arg o "$o" --argjson acc "$public" \
                '$acc + [split("\n")[] | select(length > 0) | "\($o)/\(.)"]')" || exit 1
            done
            printf '%s' "$usage" | jq -e -r --arg org "$ORG" --argjson pub "$public" \
              --argjson inc "$INCLUDED_MINUTES" '
              ($pub | map({(.): true}) | add // {}) as $public
              | [.usageItems[]
                 | select((.product // "" | ascii_downcase) == "actions"
                          and (.unitType // "" | ascii_downcase) == "minutes")] as $rows
              | if ($rows | all((.grossAmount | type) == "number"
                                and (.netAmount | type) == "number"))
                then . else error("minutes row without numeric amounts") end
              | ([$rows[] | select(.sku == "Actions Linux") | .pricePerUnit
                  | select(type == "number" and . > 0)] | first // 0.006) as $linux
              | ([$rows[]
                  | select($public["\(.organizationName // $org)/\(.repositoryName // "")"] | not)
                  | .grossAmount] | add // 0) as $drawn
              | ([$rows[] | .netAmount] | add // 0) as $billed
              | "\(($inc - ($drawn / $linux * 1000 | round) / 1000) | floor)|\($billed)"'
          )
          # <<< billing-remaining

          result="$(billing_remaining)"
          rc=$?
          if [ "$rc" -eq 0 ]; then
            remaining="${result%%|*}"
            billed="${result#*|}"
            if awk -v b="$billed" 'BEGIN { exit !(b > 0) }'; then
              ok=false
            elif [ "$remaining" -ge "$MIN_REMAIN" ]; then
              ok=true
            else
              ok=false
            fi
          else
            ok=false
            remaining=-1
            billed=-1
          fi
          printf 'ok=%s\n' "$ok" >> "$GITHUB_OUTPUT"
          printf 'remaining=%s\n' "$remaining" >> "$GITHUB_OUTPUT"
          printf 'sync-hosted-minutes: %s: %sm of %s included left, %s USD billed (rc=%s) -> GH_HOSTED_OK=%s (buffer %s)\n' \
            "$ORG" "$remaining" "$INCLUDED_MINUTES" "$billed" "$rc" "$ok" "$MIN_REMAIN"
      - name: Write GH_HOSTED_OK org variable
        env:
          GH_TOKEN: ${{ secrets.variables_token }}
          ORG: ${{ inputs.org }}
          OK: ${{ steps.compute.outputs.ok }}
        run: |
          set -euo pipefail
          gh variable set GH_HOSTED_OK --org "$ORG" --visibility all --body "$OK"
          printf 'sync-hosted-minutes: GH_HOSTED_OK set to %s for org %s\n' "$OK" "$ORG"
