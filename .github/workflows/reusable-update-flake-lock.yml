name: 'Update Nix Flake lockfile'

on:
  # Allow this workflow to be reused by other workflows:
  workflow_call:
    inputs:
      runner:
        description: 'JSON-encoded runner class (single-name self-hosted class, e.g. "eph-linux-x64")'
        default: '["self-hosted", "linux", "x64"]'
        required: false
        type: string
      flake-input:
        description: 'Parameter for determining which flake will get updated'
        default: ''
        required: false
        type: string
      sign-commits:
        description: >-
          Produce signed, GitHub-verified commits. The commit is created
          through the GitHub API using the pull-request App token, so it is
          attributed to that App and needs no signing key of our own.
        default: false
        required: false
        type: boolean

    secrets:
      NIX_GITHUB_TOKEN:
        description: GitHub token to add as access-token in nix.conf
        required: false
      NIX_GITLAB_TOKEN:
        description: GitLab token to add as access-token in nix.conf
        required: false
      CREATE_PR_APP_ID:
        description: ID of the GitHub App used for opening pull requests.
        required: true
      CREATE_PR_APP_PRIVATE_KEY:
        description: Private key of the GitHub App used for opening pull requests.
        required: true
      GIT_GPG_SIGNING_SECRET_KEY:
        description: >-
          Unused. Commit signing no longer relies on a GPG key of our own;
          the input is kept so existing callers that still pass it keep
          working, and can be dropped once they stop.
        required: false

    outputs:
      pr-url:
        description: 'Pull Request URL'
        value: ${{ jobs.main.outputs.pull-request-url }}
      pr-number:
        description: 'Pull Request Number'
        value: ${{ jobs.main.outputs.pull-request-number }}

jobs:
  main:
    runs-on: ${{ fromJSON(inputs.runner) }}
    outputs:
      pull-request-url: ${{ steps.create-pr.outputs.pull-request-url }}
      pull-request-number: ${{ steps.create-pr.outputs.pull-request-number }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Nix
        uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        with:
          push-to-cache: false
          nix-github-token: ${{ secrets.NIX_GITHUB_TOKEN }}
          nix-gitlab-token: ${{ secrets.NIX_GITLAB_TOKEN }}
          nix-gitlab-domain: ${{ vars.NIX_GITLAB_DOMAIN }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}

      - name: Configure Git credentials
        run: |
          git config --local user.name "${{ vars.GIT_USER_NAME }}"
          git config --local user.email "${{ vars.GIT_USER_EMAIL }}"
          # The commit made below is a local scratch commit: it exists only to
          # carry the update summary and the diff over to the Create Pull
          # Request step, which re-creates it through the GitHub API. Signing it
          # here would buy nothing and would tie the nightly job to the lifetime
          # of a signing key.
          git config --local commit.gpgsign false

      - name: View flake config
        run: nix config show

      - name: Run `nix flake update`
        id: update-lockfile
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 \
            https://raw.githubusercontent.com/metacraft-labs/devops-modules/dev/scripts/commit_flake_update.bash \
            -o commit_flake_update.bash && \
          bash commit_flake_update.bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FLAKE_INPUT: ${{ inputs.flake-input }}

      - uses: tibdex/github-app-token@v2.1.0
        id: generate-token
        with:
          app_id: ${{ secrets.CREATE_PR_APP_ID }}
          private_key: ${{ secrets.CREATE_PR_APP_PRIVATE_KEY }}

      - name: Create Pull Request
        id: create-pr
        if: ${{ hashFiles('commit_msg_body.txt') != '' }}
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.generate-token.outputs.token }}
          sign-commits: ${{ inputs.sign-commits }}
          title: ${{ inputs.flake-input == '' && 'Update Nix Flake lockfile' || format('Update {0} Flake input' , inputs.flake-input) }}
          body-path: commit_msg_body.txt
          branch: 'create-pull-request/update-flake-lockfile'
          delete-branch: true
          branch-suffix: timestamp
          add-paths: flake.lock
