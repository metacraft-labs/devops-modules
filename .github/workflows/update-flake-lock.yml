name: Update Nix Flake lockfile

on:
  # Enable option to manually run the action:
  workflow_dispatch:

  # Run every Sunday at 00:00:
  schedule:
    - cron: 0 0 * * 0

jobs:
  update-flake-lock:
    uses: ./.github/workflows/reusable-update-flake-lock.yml
    secrets:
      NIX_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CREATE_PR_APP_ID: ${{ secrets.CREATE_PR_APP_ID }}
      CREATE_PR_APP_PRIVATE_KEY: ${{ secrets.CREATE_PR_APP_PRIVATE_KEY }}
      GIT_GPG_SIGNING_SECRET_KEY: ${{ secrets.GIT_GPG_SIGNING_SECRET_KEY }}
      # This caller lists its secrets explicitly rather than inheriting, so the
      # read-only Attic token has to be named here to reach `setup-nix`.
      ATTIC_PULL_TOKEN: ${{ secrets.ATTIC_PULL_TOKEN }}
      ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
    with:
      runner: '["self-hosted", "linux", "x64"]'
      sign-commits: true
