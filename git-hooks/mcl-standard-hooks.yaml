# THE MCL STANDARD HOOK SET — `mcl-standard-hooks` — portable form.
#
# This is LAYER 2: the opinionated set Metacraft Labs repositories run in every
# project, assembled from the individual hooks of layer 1. It is required by
# name in `metacraft-dev-guidelines/policies/repo-requirements.md` § 4.
#
# ------------------------------------------------------------------------
# WHICH FORM IS CANONICAL FOR WHOM
# ------------------------------------------------------------------------
#
# The same set exists twice, deliberately, because the fleet is not uniform:
#
#   * `git-hooks/standard-hooks.nix`  — for a repo that consumes this flake.
#     7 repos do today: infra, io-mon, nim-stackable-hooks,
#     nix-blockchain-development, nix-codetracer-toolchains,
#     nix-nim-development, reprobuild-test-adapters.
#
#   * THIS FILE — for every other repo, and for every Windows developer.
#     PRE-COMMIT CONFIGURATION IS GENERALLY MANAGED OUTSIDE FLAKES HERE,
#     BECAUSE FLAKES ARE NOT SUPPORTED ON WINDOWS. Measured over the 159
#     workspace directories: 4 repos carry a real committed
#     `.pre-commit-config.yaml` (agent-harbor, codetracer-engine-godot,
#     reprobuild-cmake, reprobuild-specs); 15 carry one as a SYMLINK into
#     /nix/store generated at devShell entry, which on Windows produces
#     nothing at all. A hook set that exists only as a Nix module is not
#     mandatory, whatever a requirements document says about it.
#
# `agent-harbor` is the reference pattern and its own header states the design:
# the flake provides the TOOLS, the committed config provides the RULES. This
# file is that separation applied to the shared set.
#
# ------------------------------------------------------------------------
# HOW A REPO ADOPTS IT
# ------------------------------------------------------------------------
#
# Copy this block into the repo's `.pre-commit-config.yaml`, then:
#
#     prek install --install-hooks
#
# Pin `rev:` to a devops-modules commit sha or tag. Do not track a branch: a
# hook set that changes under a repo without a commit in that repo is a hook
# set nobody can bisect.
#
# ------------------------------------------------------------------------
# WHAT BOTH COMMITTED-BINARY HOOKS HAVE IN COMMON
# ------------------------------------------------------------------------
#
# Both act on files a commit ADDS, never on files already tracked. Adopting the
# set in a repo that already carries large blobs or recordings therefore does
# not retroactively fail it — only new additions are refused. That is what makes
# the requirement adoptable repo-by-repo instead of needing a flag day.
# `check-added-large-files` gets that property from upstream intersecting its
# candidates with `git diff --staged --diff-filter=A` (verified in
# pre-commit-hooks 6.0.0, check_added_large_files.py + util.added_files);
# `--enforce-all` is deliberately not passed and must not be added to "tighten"
# it. `ban-added-ct-recordings` runs the same intersection itself.

minimum_pre_commit_version: '3.0.0'

repos:
  # --- The committed-binaries tier. Mandatory, strict by default. ---------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # 1024 KB, passed explicitly because UPSTREAM'S DEFAULT IS 500 KB. This
      # is a deliberate loosening to the 1 MB the requirements document asks
      # for, not a restatement of the tool's own default — dropping the
      # argument silently halves the ceiling.
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: end-of-file-fixer

  - repo: https://github.com/metacraft-labs/devops-modules
    # Pin to a sha or tag. `dev` is shown only so the block is readable.
    rev: dev
    hooks:
      - id: ban-added-ct-recordings

  # --- Formatting and style. `language: system`, so the tool comes from the
  # --- dev env (Nix devShell on Linux/macOS, winget/scoop/choco on Windows)
  # --- rather than from a hook environment this file would have to pin per OS.
  # --- This is the agent-harbor pattern: the flake provides the TOOLS, the
  # --- committed config provides the RULES.
  #
  # MEMBERSHIP HERE MUST MATCH `git-hooks/standard-hooks.nix` EXACTLY. Two
  # expressions of one list that disagree are worse than one expression that is
  # awkward for half the fleet, because neither reader can tell which is the
  # rule. If you add a hook to one, add it to the other in the same commit.
  - repo: local
    hooks:
      - id: editorconfig-checker
        name: editorconfig-checker
        entry: editorconfig-checker
        language: system
        types: [file]

      - id: nixfmt
        name: nixfmt
        entry: nixfmt
        language: system
        files: \.nix$

      - id: terraform-format
        name: terraform-format
        description: Format Terraform/OpenTofu HCL files
        entry: tofu fmt
        language: system
        types: [file]
        files: \.(tf|tftest\.hcl)$

      - id: prettier
        name: prettier
        entry: prettier --check --list-different=false --log-level=warn --ignore-unknown --write
        language: system
        types: [text]
