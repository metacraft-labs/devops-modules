# `promtool test rules` for the GARM runner-fleet alert-rule library.
#
# Rendered against the DEFAULT thresholds (scale-set mode, external + webhook
# families ON) by checks/fleet-alerting.nix — the gate copies the rendered
# rules next to this file as `garm-fleet-alerts.yml` and runs promtool.
#
# Every alert is asserted in BOTH directions: a replay of a real incident that
# MUST fire, and a transient/healthy control that MUST stay silent. An alert
# with only a firing test is one nobody trusts — it fires on every ordinary job.
rule_files:
  - garm-fleet-alerts.yml

evaluation_interval: 1m

tests:
  # ── GarmControllerDown ─────────────────────────────────────────────────────
  # An hour of history first, so the 1h fraction is real. Then: high-mem-server
  # down for 20m pages ~10m in; a 7-minute restart blip of m3's controller —
  # the shape of 25 of the 37 down runs measured 2026-11-02..16 — does not;
  # gpu-server-001 dropping for 4 minutes in every 10 (m3's median down run is
  # 4m) pages too, which an unbroken `for: 10m` never would.
  - interval: 1m
    name: 'a GARM host down for 10m pages, so does one flapping; a restart blip and a healthy sibling are silent'
    input_series:
      - series: 'up{job="garm", instance="high-mem-server"}'
        values: '1x59 0x20 1x30'
      - series: 'up{job="garm", instance="m3:9997"}'
        values: '1x60 0x6 1x13'
      - series: 'up{job="garm", instance="gpu-server-001"}'
        values: '1x59 0x3 1x5 0x3 1x5 0x3 1x5 0x3 1x5 0x3 1x5 0x3 1x5'
      - series: 'up{job="garm", instance="ncb-healthy"}'
        values: '1x109'
    alert_rule_test:
      - eval_time: 65m
        alertname: GarmControllerDown
        exp_alerts: []
      - eval_time: 72m
        alertname: GarmControllerDown
        exp_alerts:
          - exp_labels:
              severity: critical
              component: garm-fleet
              job: garm
              instance: high-mem-server
            exp_annotations:
              summary: 'GARM controller unreachable (high-mem-server)'
              description: 'Prometheus cannot scrape GARM at high-mem-server (job garm), and it has been down for at least 10 of the last 60 minutes. No runners can be created or reaped while the controller is down — check the garm.service unit and the host.'
      # The flapping controller, in its fifth 4-minute drop (t=100-103m): 18
      # down minutes in the hour. high-mem-server answered again at t=80m and
      # its hold has run out.
      - eval_time: 101m
        alertname: GarmControllerDown
        exp_alerts:
          - exp_labels:
              severity: critical
              component: garm-fleet
              job: garm
              instance: gpu-server-001
            exp_annotations:
              summary: 'GARM controller unreachable (gpu-server-001)'
              description: 'Prometheus cannot scrape GARM at gpu-server-001 (job garm), and it has been down for at least 10 of the last 60 minutes. No runners can be created or reaped while the controller is down — check the garm.service unit and the host.'

  # ── GarmControllerUnhealthy ────────────────────────────────────────────────
  - interval: 1m
    name: 'garm_health==0 pages; a healthy controller stays silent'
    input_series:
      - series: 'garm_health{controller_id="c6cb71fc"}'
        values: '0x10'
      - series: 'garm_health{controller_id="healthy"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 3m # for: 5m not elapsed
        alertname: GarmControllerUnhealthy
        exp_alerts: []
      - eval_time: 6m
        alertname: GarmControllerUnhealthy
        exp_alerts:
          - exp_labels:
              severity: critical
              component: garm-fleet
              controller_id: c6cb71fc
            exp_annotations:
              summary: 'GARM controller reports unhealthy (c6cb71fc)'
              description: 'garm_health for controller c6cb71fc has been 0 for 5m — the process is up but degraded. Check the garm.service journal.'

  # ── GarmPoolManagerNotRunning ──────────────────────────────────────────────
  - interval: 1m
    name: 'a stopped org pool manager pages; running orgs stay silent'
    input_series:
      - series: 'garm_organization_pool_manager_status{id="21f80534", name="agent-harbor", running="false"}'
        values: '0x10'
      - series: 'garm_organization_pool_manager_status{id="9962f69f", name="metacraft-labs", running="true"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 3m # for: 5m not elapsed
        alertname: GarmPoolManagerNotRunning
        exp_alerts: []
      - eval_time: 6m
        alertname: GarmPoolManagerNotRunning
        exp_alerts:
          - exp_labels:
              severity: critical
              component: garm-fleet
              id: 21f80534
              name: agent-harbor
              running: 'false'
            exp_annotations:
              summary: 'GARM pool manager not running (agent-harbor)'
              description: 'The pool manager for org agent-harbor has been stopped for 5m. That org gets no new runners even though the controller is up — restart / check the org credentials.'

  # ── GarmProviderCreateFailures ─────────────────────────────────────────────
  # A BUSY provider losing a share of its creates: gpu001-incus's shape on
  # 2026-11-05/06/08 (25-65% of 40-110 creates an hour). Here 60 of 300 an hour
  # fail (20%). The controls: a one-off failure on `win`, and a provider failing
  # EVERY create, which is GarmProviderHighErrorRatio's and must not fire here
  # too (it is asserted in that test).
  - interval: 1m
    name: 'a busy provider losing 20% of its creates warns; a one-off failure does not'
    input_series:
      - series: 'garm_runner_errors_total{operation="CreateInstance", provider="gpu001-incus", instance="high-mem-server:9997", job="garm"}'
        values: '0+1x90'
      - series: 'garm_runner_operations_total{operation="CreateInstance", provider="gpu001-incus", instance="high-mem-server:9997", job="garm"}'
        values: '0+5x90'
      - series: 'garm_runner_errors_total{operation="CreateInstance", provider="win", instance="high-mem-server:9997", job="garm"}'
        values: '0 1+0x89'
      - series: 'garm_runner_operations_total{operation="CreateInstance", provider="win", instance="high-mem-server:9997", job="garm"}'
        values: '0+5x90'
    alert_rule_test:
      # 10 failures reached at ~10m; the 15m `for` has not elapsed.
      - eval_time: 20m
        alertname: GarmProviderCreateFailures
        exp_alerts: []
      - eval_time: 80m
        alertname: GarmProviderCreateFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              component: garm-fleet
              instance: 'high-mem-server:9997'
              provider: gpu001-incus
            exp_annotations:
              summary: 'GARM provider losing creates (gpu001-incus)'
              description: 'Provider gpu001-incus on high-mem-server:9997 has failed 60 CreateInstance calls in the last hour while most of its creates still succeed. The backend (incus/libvirt/tart/EC2) is degraded rather than down — check the provider host. When most creates fail, GarmProviderHighErrorRatio fires instead.'
      - eval_time: 80m
        alertname: GarmProviderHighErrorRatio
        exp_alerts: []

  # The OLD sawtooth: three failures in a burst, then nothing for 20 minutes,
  # repeated — the old `increase[15m] >= 3` fired on every burst. Nine an hour
  # is below the busy-provider threshold, and 9 of 120 creates is not a
  # provider that is down, so neither alert fires.
  - interval: 1m
    name: 'a provider retrying a few failed creates every 20 minutes is not an incident'
    input_series:
      - series: 'garm_runner_errors_total{operation="CreateInstance", provider="hms-incus", instance="high-mem-server:9997", job="garm"}'
        values: '0x9 1 2 3x18 4 5 6x18 7 8 9x18 10 11 12x18'
      - series: 'garm_runner_operations_total{operation="CreateInstance", provider="hms-incus", instance="high-mem-server:9997", job="garm"}'
        values: '0+2x90'
    alert_rule_test:
      - eval_time: 30m
        alertname: GarmProviderCreateFailures
        exp_alerts: []
      - eval_time: 75m
        alertname: GarmProviderCreateFailures
        exp_alerts: []
      - eval_time: 75m
        alertname: GarmProviderHighErrorRatio
        exp_alerts: []

  # ── GarmProviderDeleteFailures ─────────────────────────────────────────────
  - interval: 1m
    name: 'a delete storm against one provider pages; one failed delete does not'
    input_series:
      # gpu001 on 2026-09-23: ~20 failed DeleteInstance/min, sustained.
      - series: 'garm_runner_errors_total{operation="DeleteInstance", provider="gpu001-incus"}'
        values: '0+20x40'
      # A single transient teardown failure, then healthy.
      - series: 'garm_runner_errors_total{operation="DeleteInstance", provider="hms-incus"}'
        values: '0 1+0x39'
    alert_rule_test:
      - eval_time: 10m # for: 15m not elapsed
        alertname: GarmProviderDeleteFailures
        exp_alerts: []
      - eval_time: 30m
        alertname: GarmProviderDeleteFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              component: garm-fleet
              provider: gpu001-incus
            exp_annotations:
              summary: 'GARM cannot delete runners on gpu001-incus'
              description: "Provider gpu001-incus has failed at least 10 DeleteInstance calls in each 15m window for 15m. Finished runners are not being reclaimed on that host (unreachable serve daemon, or a teardown that keeps failing, e.g. ZFS `dataset is busy`) — they will accumulate until the host's storage fills."

  # ── GarmInstancesAbsentFromProvider ────────────────────────────────────────
  - interval: 1m
    name: 'repeated provider-absent runners page; a single one does not'
    input_series:
      # hms-libvirt on 2026-09-23: a booting Windows runner dropped every few min.
      - series: 'garm_runner_absent_from_provider_total{provider="hms-libvirt"}'
        values: '0+1x20'
      - series: 'garm_runner_absent_from_provider_total{provider="hms-incus"}'
        values: '0 1+0x19'
    alert_rule_test:
      - eval_time: 2m
        alertname: GarmInstancesAbsentFromProvider
        exp_alerts: []
      - eval_time: 10m
        alertname: GarmInstancesAbsentFromProvider
        exp_alerts:
          - exp_labels:
              severity: warning
              component: garm-fleet
              provider: hms-libvirt
            exp_annotations:
              summary: "GARM runners missing from hms-libvirt's instance list"
              description: "At least 3 instances GARM believes are running were absent from provider hms-libvirt's ListInstances in 30m. They are routed to deletion, but repeated absences mean the provider cannot see its own instances (enumeration/attribution broken) — before the fix this is exactly how ~210 VMs leaked."

  # ── GostiEphemeralStoppedOrphans ─────────────────────────────────────────────
  - interval: 1m
    name: 'stopped instances that never go away page; churn that clears does not'
    input_series:
      # gpu-server-001: STOPPED garm-* containers accumulate and stay.
      - series: 'gosti_ephemeral_instances{instance="gpu-server-001", backend="incus", state="stopped", attributed="true"}'
        values: '5+1x60'
      # hms: finished runners are stopped briefly, then deleted.
      - series: 'gosti_ephemeral_instances{instance="high-mem-server", backend="incus", state="stopped", attributed="true"}'
        values: '4 0 0 0 3 0 0 0 4 0 0 0 2 0 0 0 5 0 0 0 3 0 0 0 4 0 0 0 3 0 0 0 4 0 0 0 3 0 0 0 4 0 0 0 3 0 0 0 4 0 0 0 3 0 0 0 4 0 0 0 3'
    alert_rule_test:
      - eval_time: 5m # for: 10m not elapsed
        alertname: GostiEphemeralStoppedOrphans
        exp_alerts: []
      - eval_time: 45m
        alertname: GostiEphemeralStoppedOrphans
        exp_alerts:
          - exp_labels:
              severity: warning
              component: garm-fleet
              instance: gpu-server-001
              backend: incus
            exp_annotations:
              summary: 'Stopped runner instances are piling up on gpu-server-001 (incus)'
              description: 'gpu-server-001 has held at least 3 STOPPED per-job incus instances continuously for 30m. A finished ephemeral runner is deleted within minutes, so these are orphans whose teardown failed or was never issued; they consume storage until the pool is full (gpu-server-001/002, 2026-09-23).'

  # ── GostiEphemeralUnattributedInstances ──────────────────────────────────────
  - interval: 1m
    name: 'instances no pool owns page; ones that get attributed do not'
    input_series:
      # high-mem-server: 161 leaked garm-* domains from before attribution.
      - series: 'gosti_ephemeral_instances{instance="high-mem-server", backend="libvirt", state="running", attributed="false"}'
        values: '161x120'
      # A transient unattributed instance (between create and label) that clears.
      - series: 'gosti_ephemeral_instances{instance="gpu-server-002", backend="incus", state="running", attributed="false"}'
        values: '1 0x119'
    alert_rule_test:
      - eval_time: 20m # for: 30m not elapsed
        alertname: GostiEphemeralUnattributedInstances
        exp_alerts: []
      - eval_time: 100m
        alertname: GostiEphemeralUnattributedInstances
        exp_alerts:
          - exp_labels:
              severity: warning
              component: garm-fleet
              instance: high-mem-server
              backend: libvirt
            exp_annotations:
              summary: 'Runner instances with no owning GARM pool on high-mem-server (libvirt)'
              description: 'high-mem-server has carried 161 runner-named libvirt instances with no GARM ownership record for over an hour. No pool lists them, so GARM will never delete them: they are orphans (typically created before attribution existed, or by a create whose labelling failed).'

  # ── GostiEphemeralInventoryFailing ───────────────────────────────────────────
  - interval: 1m
    name: 'a host that cannot enumerate pages; one failed cycle does not'
    input_series:
      - series: 'gosti_ephemeral_list_success{instance="gpu-server-002", backend="incus"}'
        values: '0x30'
      - series: 'gosti_ephemeral_list_success{instance="high-mem-server", backend="libvirt"}'
        values: '1 0 1x28'
    alert_rule_test:
      - eval_time: 10m
        alertname: GostiEphemeralInventoryFailing
        exp_alerts: []
      - eval_time: 20m
        alertname: GostiEphemeralInventoryFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              component: garm-fleet
              instance: gpu-server-002
              backend: incus
            exp_annotations:
              summary: 'gpu-server-002 cannot enumerate its incus instances'
              description: "`gosti ephemeral-list --backend incus` has failed on gpu-server-002 for 15m. GARM's ListInstances for this host fails closed while this persists, so runners there are neither confirmed nor reconciled — fix the hypervisor/daemon access."

  # ── GarmProviderHighErrorRatio ─────────────────────────────────────────────
  # hms-incus-terraform during the 2026-11-12/13 ZFS write-latency incident:
  # every create fails, one a minute, for 90 minutes. It fires after an hour
  # and the 2h hold carries it past the last failure. The controls: a busy
  # healthy provider at 0.1% (6 failures an hour), and DeleteInstance failing 100% — the H7 teardown
  # retry, which is GarmInstanceStuckDeleting's to judge, not this alert's.
  - interval: 1m
    name: 'a provider failing every create warns after an hour and holds; deletes and a healthy provider do not'
    input_series:
      - series: 'garm_runner_errors_total{operation="CreateInstance", provider="hms-incus-terraform", instance="high-mem-server:9997", job="garm"}'
        values: '0+1x90'
      - series: 'garm_runner_operations_total{operation="CreateInstance", provider="hms-incus-terraform", instance="high-mem-server:9997", job="garm"}'
        values: '0+1x90'
      - series: 'garm_runner_errors_total{operation="CreateInstance", provider="win", instance="high-mem-server:9997", job="garm"}'
        values: '0+0.1x90'
      - series: 'garm_runner_operations_total{operation="CreateInstance", provider="win", instance="high-mem-server:9997", job="garm"}'
        values: '0+100x90'
      - series: 'garm_runner_errors_total{operation="DeleteInstance", provider="hms-incus", instance="high-mem-server:9997", job="garm"}'
        values: '0+3x90'
      - series: 'garm_runner_operations_total{operation="DeleteInstance", provider="hms-incus", instance="high-mem-server:9997", job="garm"}'
        values: '0+3x90'
    alert_rule_test:
      - eval_time: 45m
        alertname: GarmProviderHighErrorRatio
        exp_alerts: []
      - eval_time: 70m
        alertname: GarmProviderHighErrorRatio
        exp_alerts:
          - exp_labels:
              severity: warning
              component: garm-fleet
              instance: 'high-mem-server:9997'
              provider: hms-incus-terraform
            exp_annotations:
              summary: 'GARM provider failing most of its creates (hms-incus-terraform)'
              description: 'Provider hms-incus-terraform on high-mem-server:9997 has failed more than half of its CreateInstance/Start calls over the last hour (100%), for an hour. Its pools are not producing runners — the backend is broken (incus/libvirt/tart down, or AWS quota/subnet/AMI errors). If jobs are waiting on it, GarmFleetStarvation or GarmCapabilityPoolStarvation pages as well.'
      # Most creates fail, so the busy-provider warning stays out of it.
      - eval_time: 70m
        alertname: GarmProviderCreateFailures
        exp_alerts: []
      # The failures stop at 90m. The 1h window still holds them until ~150m,
      # and the 2h hold keeps the alert to ~4h30m.
      - eval_time: 200m
        alertname: GarmProviderHighErrorRatio
        exp_alerts:
          - exp_labels:
              severity: warning
              component: garm-fleet
              instance: 'high-mem-server:9997'
              provider: hms-incus-terraform
            exp_annotations:
              summary: 'GARM provider failing most of its creates (hms-incus-terraform)'
              description: 'Provider hms-incus-terraform on high-mem-server:9997 has failed more than half of its CreateInstance/Start calls over the last hour (100%), for an hour. Its pools are not producing runners — the backend is broken (incus/libvirt/tart down, or AWS quota/subnet/AMI errors). If jobs are waiting on it, GarmFleetStarvation or GarmCapabilityPoolStarvation pages as well.'
      - eval_time: 300m
        alertname: GarmProviderHighErrorRatio
        exp_alerts: []

  # ── GarmGithubRateLimit{Low,Critical} ──────────────────────────────────────
  - interval: 1m
    name: 'rate limit at 30 pages critical (and low); a healthy budget is silent'
    input_series:
      - series: 'garm_github_rate_limit_remaining{credential_id="1", credential_name="mcl-app", endpoint="github.com"}'
        values: '30x10'
      - series: 'garm_github_rate_limit_remaining{credential_id="2", credential_name="blocksense-app", endpoint="github.com"}'
        values: '14981x10'
    alert_rule_test:
      - eval_time: 2m # for: 5m not elapsed
        alertname: GarmGithubRateLimitCritical
        exp_alerts: []
      - eval_time: 6m
        alertname: GarmGithubRateLimitCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              component: garm-fleet
              credential_id: '1'
              credential_name: mcl-app
              endpoint: github.com
            exp_annotations:
              summary: 'GitHub API rate limit critically low (mcl-app)'
              description: 'Credential mcl-app has only 30 GitHub API requests remaining (< 50). GARM is about to be throttled — runner provisioning will stall.'
      - eval_time: 6m
        alertname: GarmGithubRateLimitLow
        exp_alerts:
          - exp_labels:
              severity: warning
              component: garm-fleet
              credential_id: '1'
              credential_name: mcl-app
              endpoint: github.com
            exp_annotations:
              summary: 'GitHub API rate limit low (mcl-app)'
              description: 'Credential mcl-app has 30 GitHub API requests remaining (< 200) for 5m. Approaching a throttle that will stall runner provisioning.'

  - interval: 1m
    name: 'rate limit at 120 pages low but NOT critical'
    input_series:
      - series: 'garm_github_rate_limit_remaining{credential_id="1", credential_name="mcl-app", endpoint="github.com"}'
        values: '120x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: GarmGithubRateLimitCritical
        exp_alerts: []
      - eval_time: 6m
        alertname: GarmGithubRateLimitLow
        exp_alerts:
          - exp_labels:
              severity: warning
              component: garm-fleet
              credential_id: '1'
              credential_name: mcl-app
              endpoint: github.com
            exp_annotations:
              summary: 'GitHub API rate limit low (mcl-app)'
              description: 'Credential mcl-app has 120 GitHub API requests remaining (< 200) for 5m. Approaching a throttle that will stall runner provisioning.'

  # ── GarmFleetStarvation (the priority page) ────────────────────────────────
  # Exactly the live 2026-09-08 shape: eph-linux-x64 (metacraft-labs, scaleset
  # id=5) at desired==max==6 with an eph-linux-x64 job queued.
  - interval: 1m
    name: 'a saturated class running none of its queued jobs pages; a working queue, saturated-only and queued-only do not'
    input_series:
      - series: 'garm_scaleset_desired_runner_count{id="5"}'
        values: '6x60'
      - series: 'garm_scaleset_max_runners{id="5"}'
        values: '6x60'
      - series: 'garm_scaleset_info{id="5", scaleset_owner="metacraft-labs", name="eph-linux-x64"}'
        values: '1x60'
      - series: 'garm_job_status{job_id="36620", owner="metacraft-labs", requested_labels="eph-linux-x64", status="queued"}'
        values: '1x60'
      # saturated but no queued jobs (eph-win-x64, id=9)
      - series: 'garm_scaleset_desired_runner_count{id="9"}'
        values: '6x60'
      - series: 'garm_scaleset_max_runners{id="9"}'
        values: '6x60'
      - series: 'garm_scaleset_info{id="9", scaleset_owner="metacraft-labs", name="eph-win-x64"}'
        values: '1x60'
      # queued jobs but NOT saturated (agent-harbor eph-linux-x64, id=6, desired 2<max 4)
      - series: 'garm_scaleset_desired_runner_count{id="6"}'
        values: '2x60'
      - series: 'garm_scaleset_max_runners{id="6"}'
        values: '4x60'
      - series: 'garm_scaleset_info{id="6", scaleset_owner="agent-harbor", name="eph-linux-x64"}'
        values: '1x60'
      - series: 'garm_job_status{job_id="40001", owner="agent-harbor", requested_labels="eph-linux-x64", status="queued"}'
        values: '1x60'
      # THE TERRAFORM-LANE SHAPE that was 117 of the 303 episodes in 14 days:
      # at its ceiling, a job queued behind one that is RUNNING. That is a
      # capacity queue, not starvation, and it must stay silent.
      - series: 'garm_scaleset_desired_runner_count{id="21"}'
        values: '6x60'
      - series: 'garm_scaleset_max_runners{id="21"}'
        values: '6x60'
      - series: 'garm_scaleset_info{id="21", scaleset_owner="metacraft-labs", name="eph-linux-x64-terraform"}'
        values: '1x60'
      - series: 'garm_job_status{job_id="50001", owner="metacraft-labs", requested_labels="eph-linux-x64-terraform", status="queued"}'
        values: '1x60'
      - series: 'garm_job_status{job_id="50000", owner="metacraft-labs", requested_labels="eph-linux-x64-terraform", status="in_progress"}'
        values: '1x60'
    alert_rule_test:
      # 30m in: the old 10m rule had paged; this one needs 30 starved minutes
      # in the hour plus a 5m `for:`.
      - eval_time: 30m
        alertname: GarmFleetStarvation
        exp_alerts: []
      - eval_time: 50m
        alertname: GarmFleetStarvation
        exp_alerts:
          - exp_labels:
              severity: critical
              component: garm-fleet
              garm_owner: metacraft-labs
              garm_class: eph-linux-x64
            exp_annotations:
              summary: 'Runner STARVATION: metacraft-labs/eph-linux-x64 saturated, jobs queued, none running'
              description: 'Class eph-linux-x64 (owner metacraft-labs) has had jobs queued while at its runner ceiling and running NONE of them for 51 of the last 60 minutes — every slot is held by a runner that takes no work. Check GarmListenerSessionShortfall and GarmProviderHighErrorRatio for the controller that serves the class, then the runners themselves (booting, offline on GitHub, or wedged in teardown).'

  # m3's eph-linux-arm64 in W47: starved for hours, but a job got a runner
  # for a minute now and then, so the condition's median unbroken stretch was
  # 31 minutes. Here a job is in progress for one minute in every five. A long `for:`
  # would never complete; 30-of-60 does.
  - interval: 1m
    name: 'a class starved with brief breaks still pages'
    input_series:
      - series: 'garm_scaleset_desired_runner_count{id="13"}'
        values: '2x60'
      - series: 'garm_scaleset_max_runners{id="13"}'
        values: '2x60'
      - series: 'garm_scaleset_info{id="13", scaleset_owner="metacraft-labs", name="eph-linux-arm64"}'
        values: '1x60'
      - series: 'garm_job_status{job_id="70001", owner="metacraft-labs", requested_labels="eph-linux-arm64", status="queued"}'
        values: '1x60'
      - series: 'garm_job_status{job_id="70000", owner="metacraft-labs", requested_labels="eph-linux-arm64", status="in_progress"}'
        values: '_x2 1 stale _x2 1 stale _x2 1 stale _x2 1 stale _x2 1 stale _x2 1 stale _x2 1 stale _x2 1 stale _x2 1 stale _x2 1 stale _x2 1 stale _x2 1 stale'
    alert_rule_test:
      - eval_time: 60m
        alertname: GarmFleetStarvation
        exp_alerts:
          - exp_labels:
              severity: critical
              component: garm-fleet
              garm_owner: metacraft-labs
              garm_class: eph-linux-arm64
            exp_annotations:
              summary: 'Runner STARVATION: metacraft-labs/eph-linux-arm64 saturated, jobs queued, none running'
              description: 'Class eph-linux-arm64 (owner metacraft-labs) has had jobs queued while at its runner ceiling and running NONE of them for 48 of the last 60 minutes — every slot is held by a runner that takes no work. Check GarmListenerSessionShortfall and GarmProviderHighErrorRatio for the controller that serves the class, then the runners themselves (booting, offline on GitHub, or wedged in teardown).'

  # ── GithubAppTokenMintFailing (external check) ─────────────────────────────
  - interval: 1m
    name: 'a non-minting App pages; a healthy App stays silent'
    input_series:
      - series: 'github_app_installation_token_mint_ok{app="mcl-app"}'
        values: '0x20'
      - series: 'github_app_installation_token_mint_ok{app="blocksense-app"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 5m # for: 15m not elapsed
        alertname: GithubAppTokenMintFailing
        exp_alerts: []
      - eval_time: 16m
        alertname: GithubAppTokenMintFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              component: garm-fleet
              app: mcl-app
            exp_annotations:
              summary: 'GitHub App token minting is failing (mcl-app)'
              description: 'The garm-fleet-external-checks exporter could not mint an installation token for App mcl-app for 15m. The App private key/JWT is rejected (rotated, revoked, clock skew, or the installation was removed) — GARM cannot register or reap runners for that org. Rotate/repair the App credential.'

  # ── GithubWebhookDeliveryFailing (external, post-Phase-C) ───────────────────
  - interval: 1m
    name: 'a failing webhook delivery pages; a healthy one stays silent'
    input_series:
      - series: 'github_webhook_last_delivery_ok{org="metacraft-labs", hook_id="123"}'
        values: '0x40'
      - series: 'github_webhook_last_delivery_ok{org="blocksense-network", hook_id="456"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 10m # for: 30m not elapsed
        alertname: GithubWebhookDeliveryFailing
        exp_alerts: []
      - eval_time: 31m
        alertname: GithubWebhookDeliveryFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              component: garm-fleet
              org: metacraft-labs
              hook_id: '123'
            exp_annotations:
              summary: 'GitHub webhook deliveries are failing (metacraft-labs)'
              description: 'GitHub reports the most recent webhook delivery to the controller endpoint for metacraft-labs (hook 123) as non-2xx for 30m. Job events are not reaching GARM — check the Cloudflare Tunnel / public endpoint and the org webhook config.'

  # ── GithubWebhookEndpointProbeDown (external, post-Phase-C) ─────────────────
  - interval: 1m
    name: 'a failed blackbox probe pages; a passing probe stays silent'
    input_series:
      - series: 'probe_success{job="blackbox-webhook", instance="ci-hms.example.com"}'
        values: '0x10'
      - series: 'probe_success{job="blackbox-webhook", instance="ci-ok.example.com"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 3m # for: 5m not elapsed
        alertname: GithubWebhookEndpointProbeDown
        exp_alerts: []
      - eval_time: 6m
        alertname: GithubWebhookEndpointProbeDown
        exp_alerts:
          - exp_labels:
              severity: critical
              component: garm-fleet
              job: blackbox-webhook
              instance: ci-hms.example.com
            exp_annotations:
              summary: 'GARM public webhook endpoint probe is failing (ci-hms.example.com)'
              description: 'The blackbox probe of the public webhook endpoint ci-hms.example.com has failed for 5m (tunnel down, cert expired, or endpoint unreachable). GitHub cannot deliver workflow_job events.'

  # ── GarmWebhookHmacFailures (GARM-side, post-Phase-C) ──────────────────────
  - interval: 1m
    name: 'sustained HMAC-invalid deliveries page; valid deliveries stay silent'
    input_series:
      # Invalid deliveries accrue (1/min) -> increase[10m] stays >= 1.
      - series: 'garm_webhook_received{valid="false", reason="signature"}'
        values: '0+1x30'
      # A healthy stream of VALID deliveries must never trip the valid="false" rule.
      - series: 'garm_webhook_received{valid="true", reason=""}'
        values: '0+5x30'
    alert_rule_test:
      - eval_time: 5m # for: 10m not elapsed
        alertname: GarmWebhookHmacFailures
        exp_alerts: []
      - eval_time: 13m
        alertname: GarmWebhookHmacFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              component: garm-fleet
              valid: 'false'
              reason: signature
            exp_annotations:
              summary: 'GARM is rejecting webhook deliveries (HMAC/parse)'
              description: 'GARM has recorded webhook deliveries with valid="false" (reason signature) for 10m. The per-entity webhook secret likely does not match GitHub, or a relay is corrupting the payload — new jobs from the affected org will not scale runners.'

  # ── GarmFleetOverProvision (RC5 thundering-herd watch) ─────────────────────
  # runners CREATED / jobs SERVED over the 1h window. Each job flips
  # garm_job_status{status="completed"} from 0->1 at t=41m (inside the trailing
  # hour at the 90m eval) so the served-jobs subquery increase counts it; the
  # CreateInstance counter is a normal rising provider counter.
  #
  # HERD: a provider spins up 12 runners/min (720 in the window) while only 5
  # jobs complete -> ratio ~144, >= the served floor -> pages (after for: 30m).
  - interval: 1m
    name: 'a herd (many runners created, few jobs served) pages; not before for elapses'
    input_series:
      - series: 'garm_runner_operations_total{operation="CreateInstance", provider="gosti"}'
        values: '0+12x120'
      - series: 'garm_job_status{job_id="1", owner="metacraft-labs", requested_labels="eph-linux-x64", status="completed"}'
        values: '0x40 1x80'
      - series: 'garm_job_status{job_id="2", owner="metacraft-labs", requested_labels="eph-linux-x64", status="completed"}'
        values: '0x40 1x80'
      - series: 'garm_job_status{job_id="3", owner="metacraft-labs", requested_labels="eph-linux-x64", status="completed"}'
        values: '0x40 1x80'
      - series: 'garm_job_status{job_id="4", owner="metacraft-labs", requested_labels="eph-linux-x64", status="completed"}'
        values: '0x40 1x80'
      - series: 'garm_job_status{job_id="5", owner="metacraft-labs", requested_labels="eph-linux-x64", status="completed"}'
        values: '0x40 1x80'
    alert_rule_test:
      - eval_time: 60m # ratio already high + served >= 5, but for: 30m not elapsed
        alertname: GarmFleetOverProvision
        exp_alerts: []
      - eval_time: 90m
        alertname: GarmFleetOverProvision
        exp_alerts:
          - exp_labels:
              severity: warning
              component: garm-fleet
            exp_annotations:
              summary: 'Runner OVER-PROVISION: 144x more runners created than jobs served'
              description: 'Over the last 1h the fleet created more than 2x as many runners as jobs it served (144x), sustained for 30m, with at least 5 jobs served — a thundering-herd over-provision. In the coordinated central-GARM pool topology this ratio should sit near 1 (one ephemeral runner per job); a spike means a provider is spinning up runners that never serve a job. Check garm:runners_created:increase per provider for the offending host and the provider CreateInstance/DeleteInstance churn.'

  # HEALTHY: created rises in lock-step with served (6 each) -> ratio ~1 -> silent
  # even though the served floor (5) is cleared. This is the one-runner-per-job
  # steady state the pool topology is supposed to hold.
  - interval: 1m
    name: 'one runner per job (ratio ~1) stays silent above the served floor'
    input_series:
      - series: 'garm_runner_operations_total{operation="CreateInstance", provider="gosti"}'
        values: '0x40 0+1x6 6x90'
      - series: 'garm_job_status{job_id="11", owner="metacraft-labs", requested_labels="eph-linux-x64", status="completed"}'
        values: '0x40 1x80'
      - series: 'garm_job_status{job_id="12", owner="metacraft-labs", requested_labels="eph-linux-x64", status="completed"}'
        values: '0x40 1x80'
      - series: 'garm_job_status{job_id="13", owner="metacraft-labs", requested_labels="eph-linux-x64", status="completed"}'
        values: '0x40 1x80'
      - series: 'garm_job_status{job_id="14", owner="metacraft-labs", requested_labels="eph-linux-x64", status="completed"}'
        values: '0x40 1x80'
      - series: 'garm_job_status{job_id="15", owner="metacraft-labs", requested_labels="eph-linux-x64", status="completed"}'
        values: '0x40 1x80'
      - series: 'garm_job_status{job_id="16", owner="metacraft-labs", requested_labels="eph-linux-x64", status="completed"}'
        values: '0x40 1x80'
    alert_rule_test:
      - eval_time: 90m
        alertname: GarmFleetOverProvision
        exp_alerts: []

  # FLOOR GUARD: a big create burst but only 2 jobs served (below the floor of 5)
  # -> silent. This is the warm-min-idle-floor-during-a-quiet-period case that
  # must never page: a high ratio on tiny volume is not a herd.
  - interval: 1m
    name: 'a high ratio below the served floor (warm floor / quiet) stays silent'
    input_series:
      - series: 'garm_runner_operations_total{operation="CreateInstance", provider="gosti"}'
        values: '0+12x120'
      - series: 'garm_job_status{job_id="21", owner="metacraft-labs", requested_labels="eph-linux-x64", status="completed"}'
        values: '0x40 1x80'
      - series: 'garm_job_status{job_id="22", owner="metacraft-labs", requested_labels="eph-linux-x64", status="completed"}'
        values: '0x40 1x80'
    alert_rule_test:
      - eval_time: 90m
        alertname: GarmFleetOverProvision
        exp_alerts: []

  # ── GarmListenerSessionShortfall / GarmListenerPollStalled ─────────────────
  # A scale-set controller opens ONE GitHub message session per scale set and
  # long-polls it. When a worker's session dies and is never re-opened, GARM
  # logs nothing at all — no error, no warning, no backoff — so the arithmetic
  # below is the only signal that exists. Both alerts are duration-gated: a
  # controlled restart drops every session in the same scrape and must not page.
  - interval: 1m
    name: 'listeners that die and never come back page; 10m into the shortfall is not enough'
    input_series:
      - series: 'garm_scaleset_info{instance="high-mem-server", id="5", scaleset_owner="acme", name="eph-linux-x64"}'
        values: '1x40'
      - series: 'garm_scaleset_info{instance="high-mem-server", id="6", scaleset_owner="acme", name="eph-win-x64"}'
        values: '1x40'
      - series: 'garm_scaleset_info{instance="high-mem-server", id="7", scaleset_owner="acme", name="eph-macos-arm64"}'
        values: '1x40'
      - series: 'garm_github_operations_total{instance="high-mem-server", operation="CreateMessageSession", scope="Organization"}'
        values: '3x40'
      # one listener drops at t=10m and is never re-created
      - series: 'garm_github_operations_total{instance="high-mem-server", operation="DeleteMessageSession", scope="Organization"}'
        values: '0+0x9 1+0x31'
    promql_expr_test:
      - expr: garm:listener_entities_declared
        eval_time: 20m
        exp_samples:
          - labels: '{__name__="garm:listener_entities_declared", instance="high-mem-server"}'
            value: 3
      # the `or 0 * <creates>` arm: before the first delete there is no
      # DeleteMessageSession series at all, and this must still be 3, not empty
      - expr: garm:message_sessions_live
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="garm:message_sessions_live", instance="high-mem-server"}'
            value: 3
      - expr: garm:message_sessions_live
        eval_time: 20m
        exp_samples:
          - labels: '{__name__="garm:message_sessions_live", instance="high-mem-server"}'
            value: 2
    alert_rule_test:
      - eval_time: 20m # for: 15m not elapsed
        alertname: GarmListenerSessionShortfall
        exp_alerts: []
      - eval_time: 26m
        alertname: GarmListenerSessionShortfall
        exp_alerts:
          - exp_labels:
              severity: critical
              component: garm-fleet
              instance: high-mem-server
            exp_annotations:
              summary: 'GARM listeners MISSING on high-mem-server (1 message session(s) short)'
              description: 'Controller high-mem-server has had 1 fewer live GitHub message session(s) (CreateMessageSession minus DeleteMessageSession) than it has declared scale sets/pools, for 15m. Those scale sets are no longer claiming jobs and GARM will not say so — it logs no error, no warning and no backoff for a dead listener, which is how this went unnoticed for four days on 2026-09-02. Corroborate with garm:message_session_poll_interval_seconds (healthy is roughly 45-50s per session), then restart GARM on that host and confirm every scale set logs starting consumer.'

  # ── GarmListenerSessionShortfall: a shortfall that SURVIVES a restart ─────
  # m3:9997 as measured 2026-11-12..16: 6 scale sets declared, 4 sessions live,
  # and the controller restarted (here: five minutes with no scrape at
  # t=30-34m) without the missing two coming back. Without the hold the alert
  # resolved during the gap and paged again 15m after the restart — 5
  # episodes for one fault in a week. With `keep_firing_for: 30m` it is one.
  - interval: 1m
    name: 'a shortfall that survives a controller restart stays ONE alert'
    input_series:
      - series: 'garm_scaleset_info{instance="m3:9997", id="13", name="eph-linux-arm64", scaleset_owner="metacraft-labs", scaleset_type="organization"}'
        values: '1x29 _x5 1x30'
      - series: 'garm_scaleset_info{instance="m3:9997", id="15", name="eph-win-arm64", scaleset_owner="metacraft-labs", scaleset_type="organization"}'
        values: '1x29 _x5 1x30'
      - series: 'garm_scaleset_info{instance="m3:9997", id="19", name="eph-macos-arm64", scaleset_owner="metacraft-labs", scaleset_type="organization"}'
        values: '1x29 _x5 1x30'
      - series: 'garm_scaleset_info{instance="m3:9997", id="16", name="eph-linux-arm64", scaleset_owner="schelling-point-labs", scaleset_type="enterprise"}'
        values: '1x29 _x5 1x30'
      - series: 'garm_scaleset_info{instance="m3:9997", id="17", name="eph-macos-arm64", scaleset_owner="schelling-point-labs", scaleset_type="enterprise"}'
        values: '1x29 _x5 1x30'
      - series: 'garm_scaleset_info{instance="m3:9997", id="18", name="eph-win-arm64", scaleset_owner="schelling-point-labs", scaleset_type="enterprise"}'
        values: '1x29 _x5 1x30'
      - series: 'garm_github_operations_total{instance="m3:9997", operation="CreateMessageSession", scope="Organization"}'
        values: '3x29 _x5 2x30'
      - series: 'garm_github_operations_total{instance="m3:9997", operation="CreateMessageSession", scope="Enterprise"}'
        values: '3x29 _x5 2x30'
      - series: 'garm_github_operations_total{instance="m3:9997", operation="DeleteMessageSession", scope="Organization"}'
        values: '1x29 _x5 0x30'
      - series: 'garm_github_operations_total{instance="m3:9997", operation="DeleteMessageSession", scope="Enterprise"}'
        values: '1x29 _x5 0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: GarmListenerSessionShortfall
        exp_alerts:
          - exp_labels:
              severity: critical
              component: garm-fleet
              instance: m3:9997
            exp_annotations:
              summary: 'GARM listeners MISSING on m3:9997 (2 message session(s) short)'
              description: 'Controller m3:9997 has had 2 fewer live GitHub message session(s) (CreateMessageSession minus DeleteMessageSession) than it has declared scale sets/pools, for 15m. Those scale sets are no longer claiming jobs and GARM will not say so — it logs no error, no warning and no backoff for a dead listener, which is how this went unnoticed for four days on 2026-09-02. Corroborate with garm:message_session_poll_interval_seconds (healthy is roughly 45-50s per session), then restart GARM on that host and confirm every scale set logs starting consumer.'
      # During the scrape gap the expression is empty; the hold keeps it.
      - eval_time: 36m
        alertname: GarmListenerSessionShortfall
        exp_alerts:
          - exp_labels:
              severity: critical
              component: garm-fleet
              instance: m3:9997
            exp_annotations:
              summary: 'GARM listeners MISSING on m3:9997 (2 message session(s) short)'
              description: 'Controller m3:9997 has had 2 fewer live GitHub message session(s) (CreateMessageSession minus DeleteMessageSession) than it has declared scale sets/pools, for 15m. Those scale sets are no longer claiming jobs and GARM will not say so — it logs no error, no warning and no backoff for a dead listener, which is how this went unnoticed for four days on 2026-09-02. Corroborate with garm:message_session_poll_interval_seconds (healthy is roughly 45-50s per session), then restart GARM on that host and confirm every scale set logs starting consumer.'
      # 10m after the restart: without the hold this would only be pending.
      - eval_time: 45m
        alertname: GarmListenerSessionShortfall
        exp_alerts:
          - exp_labels:
              severity: critical
              component: garm-fleet
              instance: m3:9997
            exp_annotations:
              summary: 'GARM listeners MISSING on m3:9997 (2 message session(s) short)'
              description: 'Controller m3:9997 has had 2 fewer live GitHub message session(s) (CreateMessageSession minus DeleteMessageSession) than it has declared scale sets/pools, for 15m. Those scale sets are no longer claiming jobs and GARM will not say so — it logs no error, no warning and no backoff for a dead listener, which is how this went unnoticed for four days on 2026-09-02. Corroborate with garm:message_session_poll_interval_seconds (healthy is roughly 45-50s per session), then restart GARM on that host and confirm every scale set logs starting consumer.'

  - interval: 1m
    name: 'a controlled restart drops every session in one scrape and does NOT page'
    input_series:
      - series: 'garm_scaleset_info{instance="high-mem-server", id="5", scaleset_owner="acme", name="eph-linux-x64"}'
        values: '1x40'
      - series: 'garm_scaleset_info{instance="high-mem-server", id="6", scaleset_owner="acme", name="eph-win-x64"}'
        values: '1x40'
      - series: 'garm_scaleset_info{instance="high-mem-server", id="7", scaleset_owner="acme", name="eph-macos-arm64"}'
        values: '1x40'
      # restart at t=20m: both counters reset together, consumers back at t=21m
      - series: 'garm_github_operations_total{instance="high-mem-server", operation="CreateMessageSession", scope="Organization"}'
        values: '6+0x19 0 3+0x20'
      - series: 'garm_github_operations_total{instance="high-mem-server", operation="DeleteMessageSession", scope="Organization"}'
        values: '3+0x19 0+0x21'
    promql_expr_test:
      # the dip is REAL — this is what a per-sample rule would page on
      - expr: garm:listener_entities_declared - garm:message_sessions_live
        eval_time: 20m
        exp_samples:
          - labels: '{instance="high-mem-server"}'
            value: 3
      - expr: garm:message_sessions_live
        eval_time: 21m
        exp_samples:
          - labels: '{__name__="garm:message_sessions_live", instance="high-mem-server"}'
            value: 3
    alert_rule_test:
      - eval_time: 19m
        alertname: GarmListenerSessionShortfall
        exp_alerts: []
      - eval_time: 20m # the dip sample itself
        alertname: GarmListenerSessionShortfall
        exp_alerts: []
      - eval_time: 21m
        alertname: GarmListenerSessionShortfall
        exp_alerts: []
      - eval_time: 40m
        alertname: GarmListenerSessionShortfall
        exp_alerts: []

  - interval: 1m
    name: 'a long poll that stalls while sessions still count live pages; a healthy 45s poll does not'
    input_series:
      - series: 'garm_scaleset_info{instance="high-mem-server", id="5", scaleset_owner="acme", name="eph-linux-x64"}'
        values: '1x90'
      - series: 'garm_scaleset_info{instance="high-mem-server", id="6", scaleset_owner="acme", name="eph-win-x64"}'
        values: '1x90'
      - series: 'garm_scaleset_info{instance="high-mem-server", id="7", scaleset_owner="acme", name="eph-macos-arm64"}'
        values: '1x90'
      - series: 'garm_github_operations_total{instance="high-mem-server", operation="CreateMessageSession", scope="Organization"}'
        values: '3x90'
      # 4 polls/min for three sessions = 45s each, then a trickle from t=30m:
      # the sessions are still counted live, but nobody is listening on them.
      - series: 'garm_github_operations_total{instance="high-mem-server", operation="GetMessage", scope="Organization"}'
        values: '0+4x30 120+0.2x60'
    promql_expr_test:
      - expr: garm:message_session_poll_interval_seconds
        eval_time: 25m
        exp_samples:
          - labels: '{__name__="garm:message_session_poll_interval_seconds", instance="high-mem-server"}'
            value: 45
    alert_rule_test:
      - eval_time: 25m # healthy long poll
        alertname: GarmListenerPollStalled
        exp_alerts: []
      - eval_time: 40m # stalled, but for: 15m not elapsed
        alertname: GarmListenerPollStalled
        exp_alerts: []
      - eval_time: 60m
        alertname: GarmListenerPollStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              component: garm-fleet
              instance: high-mem-server
            exp_annotations:
              summary: 'GARM long-poll STALLED on high-mem-server (900s between GetMessage calls)'
              description: 'Controller high-mem-server still counts live GitHub message sessions, but the mean interval between GetMessage long-polls has been above 180s for 15m (900s). A healthy long poll returns every 45-50s per session, so the sessions exist on paper while nothing is actually listening — the other half of the 2026-09-02 failure mode, and the signal its session count was reconstructed from. Restart GARM on that host.'
      # a stall does not disturb the session arithmetic: the two signals are
      # independent, not one restated twice
      - eval_time: 60m
        alertname: GarmListenerSessionShortfall
        exp_alerts: []

  # A POOL-mode controller is webhook-driven and opens NO message sessions at
  # all (measured on a live pool-mode GARM 2026-09-15: 18 garm_pool_info, 8368
  # garm_webhook_received, and not one CreateMessageSession/GetMessage series).
  # Counting its pools into an expected-session total would page forever, so the
  # declared count takes pools only where there are no scale sets and the
  # shortfall alert needs a live-session series on the same instance to subtract
  # from. This is the false-positive guard for the whole family.
  - interval: 1m
    name: 'a pool-mode, webhook-driven controller with no message sessions never pages'
    input_series:
      - series: 'garm_pool_info{instance="gpu-server-002", id="0e1a", pool_owner="acme", provider_name="incus"}'
        values: '1x40'
      - series: 'garm_pool_info{instance="gpu-server-002", id="1f2b", pool_owner="acme", provider_name="incus"}'
        values: '1x40'
      - series: 'garm_webhook_received{instance="gpu-server-002", reason="", valid="true"}'
        values: '100+3x40'
    promql_expr_test:
      - expr: garm:listener_entities_declared
        eval_time: 30m
        exp_samples:
          - labels: '{__name__="garm:listener_entities_declared", instance="gpu-server-002"}'
            value: 2
      - expr: garm:message_sessions_live
        eval_time: 30m
        exp_samples: []
    alert_rule_test:
      - eval_time: 40m
        alertname: GarmListenerSessionShortfall
        exp_alerts: []
      - eval_time: 40m
        alertname: GarmListenerPollStalled
        exp_alerts: []

  # ── Watchdog (dead-man's switch heartbeat) ─────────────────────────────────
  # The only alert with no firing/silent duality: it fires ALWAYS, by design.
  # Its silence (a dead alerter) is what the off-host sink alarms on — there is
  # no healthy-input control that makes it stop, and that is the whole point.
  - interval: 1m
    name: 'the Watchdog heartbeat fires continuously (severity=none)'
    input_series: []
    alert_rule_test:
      - eval_time: 1m
        alertname: Watchdog
        exp_alerts:
          - exp_labels:
              severity: none
              component: garm-fleet
            exp_annotations:
              summary: 'Alerting pipeline heartbeat (always firing)'
              description: "This alert is always firing. It is routed to an off-host dead-man's switch that alarms if these notifications STOP arriving — i.e. if Prometheus, Alertmanager, this host, or the network has died. If YOU are reading this as a page, the routing is misconfigured (the Watchdog must go only to the dead-man receiver)."
      - eval_time: 30m
        alertname: Watchdog
        exp_alerts:
          - exp_labels:
              severity: none
              component: garm-fleet
            exp_annotations:
              summary: 'Alerting pipeline heartbeat (always firing)'
              description: "This alert is always firing. It is routed to an off-host dead-man's switch that alarms if these notifications STOP arriving — i.e. if Prometheus, Alertmanager, this host, or the network has died. If YOU are reading this as a page, the routing is misconfigured (the Watchdog must go only to the dead-man receiver)."

  # ── GarmCapabilityPoolStarvation ───────────────────────────────────────────
  # Replays the 2026-10-17 incident with its real label values: agent-harbor
  # with 22 instance records against 22 declared pool slots, of which 10 are
  # dead (6 pending_delete + 4 deleting), and jobs queued on a CAPABILITY class
  # (`self-hosted linux x64`) that `garm:class_saturated` cannot see.
  #
  # The control arm is the part that matters: the SAME shaped incident where
  # the corpses are absent leaves a free slot, and must stay silent — the alert
  # has to mean "no slot available", not "lots of jobs queued".
  - interval: 1m
    name: 'a fully-allocated capability-pool owner with queued jobs pages; a free slot is silent'
    input_series:
      # Two pools, 1 slot each => 2 declared slots for agent-harbor.
      - series: 'garm_pool_max_runners{id="pool-a", instance="high-mem-server:9997", job="garm"}'
        values: '1x40'
      - series: 'garm_pool_max_runners{id="pool-b", instance="high-mem-server:9997", job="garm"}'
        values: '1x40'
      - series: 'garm_pool_info{id="pool-a", pool_owner="agent-harbor", instance="high-mem-server:9997", job="garm"}'
        values: '1x40'
      - series: 'garm_pool_info{id="pool-b", pool_owner="agent-harbor", instance="high-mem-server:9997", job="garm"}'
        values: '1x40'
      # Both slots allocated: one live, one a pending_delete corpse.
      - series: 'garm_runner_status{name="garm-live", pool_id="pool-a", pool_owner="agent-harbor", provider="hms-incus", status="running", runner_status="active", instance="high-mem-server:9997", job="garm"}'
        values: '1x40'
      - series: 'garm_runner_status{name="garm-corpse", pool_id="pool-b", pool_owner="agent-harbor", provider="hms-incus", status="pending_delete", runner_status="terminated", instance="high-mem-server:9997", job="garm"}'
        values: '1x40'
      # Demand on a CAPABILITY class — the shape garm:class_saturated misses.
      - series: 'garm_job_status{status="queued", owner="agent-harbor", requested_labels="self-hosted linux x64", job_id="1", instance="high-mem-server:9997", job="garm"}'
        values: '1x40'
      - series: 'garm_job_status{status="queued", owner="agent-harbor", requested_labels="self-hosted linux x64", job_id="2", instance="high-mem-server:9997", job="garm"}'
        values: '1x40'
    promql_expr_test:
      # The arithmetic the incident turned on: allocation counts the corpse.
      - expr: garm:pool_slots_allocated
        eval_time: 20m
        exp_samples:
          - labels: '{__name__="garm:pool_slots_allocated", pool_owner="agent-harbor"}'
            value: 2
      - expr: garm:pool_slots_free
        eval_time: 20m
        exp_samples:
          - labels: '{__name__="garm:pool_slots_free", pool_owner="agent-harbor"}'
            value: 0
      # And the proof of the gap: the scale-set-only rule sees nothing here.
      - expr: garm:class_saturated
        eval_time: 20m
        exp_samples: []
    alert_rule_test:
      - eval_time: 10m
        alertname: GarmCapabilityPoolStarvation
        exp_alerts: []
      - eval_time: 20m
        alertname: GarmCapabilityPoolStarvation
        exp_alerts:
          - exp_labels:
              severity: critical
              component: garm-fleet
              garm_owner: agent-harbor
            exp_annotations:
              summary: 'Runner STARVATION (capability pools): agent-harbor has 2 job(s) queued and ZERO free pool slots'
              description: '2 job(s) have been queued for 15m for owner agent-harbor while every declared capability-pool slot it owns is allocated. This is the pool-side counterpart of GarmFleetStarvation, which only covers scale-set classes and cannot see this. Allocation counts instances in `pending_delete`/`deleting` too, because GARM charges those against maxRunners until the record disappears — so check GarmInstanceStuckDeleting FIRST: if corpses are holding the slots, the fix is teardown, not more capacity. Raising maxRunners on a host that cannot tear down makes it worse.'

  - interval: 1m
    name: 'queued jobs with a FREE pool slot stay silent (the alert means no capacity, not busy)'
    input_series:
      - series: 'garm_pool_max_runners{id="pool-a", instance="high-mem-server:9997", job="garm"}'
        values: '1x40'
      - series: 'garm_pool_max_runners{id="pool-b", instance="high-mem-server:9997", job="garm"}'
        values: '1x40'
      - series: 'garm_pool_info{id="pool-a", pool_owner="agent-harbor", instance="high-mem-server:9997", job="garm"}'
        values: '1x40'
      - series: 'garm_pool_info{id="pool-b", pool_owner="agent-harbor", instance="high-mem-server:9997", job="garm"}'
        values: '1x40'
      # Only one of the two slots is taken — pool-b is free.
      - series: 'garm_runner_status{name="garm-live", pool_id="pool-a", pool_owner="agent-harbor", provider="hms-incus", status="running", runner_status="active", instance="high-mem-server:9997", job="garm"}'
        values: '1x40'
      - series: 'garm_job_status{status="queued", owner="agent-harbor", requested_labels="self-hosted linux x64", job_id="1", instance="high-mem-server:9997", job="garm"}'
        values: '1x40'
    promql_expr_test:
      - expr: garm:pool_slots_free
        eval_time: 20m
        exp_samples:
          - labels: '{__name__="garm:pool_slots_free", pool_owner="agent-harbor"}'
            value: 1
    alert_rule_test:
      - eval_time: 20m
        alertname: GarmCapabilityPoolStarvation
        exp_alerts: []

  # ── GarmInstanceStuckDeleting ──────────────────────────────────────────────
  # The 2026-10-17 signal: eleven instances wedged in pending_delete for a
  # median of 169 minutes. Since 2026-11-16 the alert counts wedged instances
  # per controller and fires at five, because a page per corpse was 544
  # episodes in 14 days. Asserted both ways: five corpses past 30m page (one
  # of them flipping pending_delete -> deleting, which must not reset its
  # age), and the documented H7 drain — instances that clear inside 20m, or
  # four long-lived corpses — does not.
  - interval: 1m
    name: 'five instances wedged in teardown page; normal 20m drains and four corpses are silent'
    input_series:
      - series: 'garm_runner_status{name="garm-w1", pool_id="pool-a", pool_owner="agent-harbor", provider="hms-incus-terraform", status="pending_delete", runner_status="terminated", instance="high-mem-server:9997", job="garm"}'
        values: '1x60'
      - series: 'garm_runner_status{name="garm-w2", pool_id="pool-a", pool_owner="agent-harbor", provider="hms-incus-terraform", status="pending_delete", runner_status="terminated", instance="high-mem-server:9997", job="garm"}'
        values: '1x60'
      - series: 'garm_runner_status{name="garm-w3", pool_id="pool-a", pool_owner="agent-harbor", provider="hms-incus", status="pending_delete", runner_status="terminated", instance="high-mem-server:9997", job="garm"}'
        values: '1x60'
      - series: 'garm_runner_status{name="garm-w4", pool_id="pool-a", pool_owner="agent-harbor", provider="hms-incus", status="pending_delete", runner_status="terminated", instance="high-mem-server:9997", job="garm"}'
        values: '1x60'
      - series: 'garm_runner_status{name="garm-w5", pool_id="pool-a", pool_owner="agent-harbor", provider="hms-incus", status="pending_delete", runner_status="terminated", instance="high-mem-server:9997", job="garm"}'
        values: '1x14 _x46'
      - series: 'garm_runner_status{name="garm-w5", pool_id="pool-a", pool_owner="agent-harbor", provider="hms-incus", status="deleting", runner_status="terminated", instance="high-mem-server:9997", job="garm"}'
        values: '_x15 1x45'
      - series: 'garm_runner_status{name="garm-drain1", pool_id="pool-a", pool_owner="agent-harbor", provider="hms-incus", status="pending_delete", runner_status="terminated", instance="high-mem-server:9997", job="garm"}'
        values: '1x20'
      - series: 'garm_runner_status{name="garm-drain2", pool_id="pool-a", pool_owner="agent-harbor", provider="hms-incus", status="pending_delete", runner_status="terminated", instance="high-mem-server:9997", job="garm"}'
        values: '_x20 1x20'
      - series: 'garm_runner_status{name="garm-drain3", pool_id="pool-a", pool_owner="agent-harbor", provider="hms-incus", status="pending_delete", runner_status="terminated", instance="high-mem-server:9997", job="garm"}'
        values: '_x40 1x20'
    alert_rule_test:
      # 20m: nobody has been in teardown for 30m yet.
      - eval_time: 20m
        alertname: GarmInstanceStuckDeleting
        exp_alerts: []
      - eval_time: 40m
        alertname: GarmInstanceStuckDeleting
        exp_alerts:
          - exp_labels:
              severity: critical
              component: garm-fleet
              instance: 'high-mem-server:9997'
            exp_annotations:
              summary: 'GARM high-mem-server:9997 has 5 instances in teardown for 30m+'
              description: '5 instances on controller high-mem-server:9997 have been in pending_delete/deleting for over 30m. A healthy teardown clears in 10-25m even with the H7 `dataset is busy` retry defect, so this is teardown that has stopped converging — and every one of them still occupies a slot against its pool maxRunners until the record is gone. List them with `count_over_time(garm:instance_deleting{instance="high-mem-server:9997"}[30m]) >= 28` (labels name, provider, pool_owner), identify the mount-namespace holders with `scripts/incus-busy-dataset-holders.sh` on the provider host, and check that host load: the H7 unmount race drains far slower under CPU starvation.'

  - interval: 1m
    name: 'four long-lived corpses and a stream of 20m drains do not page'
    input_series:
      - series: 'garm_runner_status{name="garm-w1", pool_id="pool-a", pool_owner="agent-harbor", provider="hms-incus-terraform", status="pending_delete", runner_status="terminated", instance="high-mem-server:9997", job="garm"}'
        values: '1x90'
      - series: 'garm_runner_status{name="garm-w2", pool_id="pool-a", pool_owner="agent-harbor", provider="hms-incus-terraform", status="pending_delete", runner_status="terminated", instance="high-mem-server:9997", job="garm"}'
        values: '1x90'
      - series: 'garm_runner_status{name="garm-w3", pool_id="pool-a", pool_owner="agent-harbor", provider="hms-incus", status="pending_delete", runner_status="terminated", instance="high-mem-server:9997", job="garm"}'
        values: '1x90'
      - series: 'garm_runner_status{name="garm-w4", pool_id="pool-a", pool_owner="agent-harbor", provider="hms-incus", status="pending_delete", runner_status="terminated", instance="high-mem-server:9997", job="garm"}'
        values: '1x90'
      - series: 'garm_runner_status{name="garm-drain1", pool_id="pool-a", pool_owner="agent-harbor", provider="hms-incus", status="pending_delete", runner_status="terminated", instance="high-mem-server:9997", job="garm"}'
        values: '1x20 _x70'
      - series: 'garm_runner_status{name="garm-drain2", pool_id="pool-a", pool_owner="agent-harbor", provider="hms-incus", status="pending_delete", runner_status="terminated", instance="high-mem-server:9997", job="garm"}'
        values: '_x15 1x20 _x55'
      - series: 'garm_runner_status{name="garm-drain3", pool_id="pool-a", pool_owner="agent-harbor", provider="hms-incus", status="pending_delete", runner_status="terminated", instance="high-mem-server:9997", job="garm"}'
        values: '_x30 1x20 _x40'
      - series: 'garm_runner_status{name="garm-drain4", pool_id="pool-a", pool_owner="agent-harbor", provider="hms-incus", status="pending_delete", runner_status="terminated", instance="high-mem-server:9997", job="garm"}'
        values: '_x45 1x20 _x25'
      - series: 'garm_runner_status{name="garm-drain5", pool_id="pool-a", pool_owner="agent-harbor", provider="hms-incus", status="pending_delete", runner_status="terminated", instance="high-mem-server:9997", job="garm"}'
        values: '_x60 1x20 _x10'
    alert_rule_test:
      - eval_time: 45m
        alertname: GarmInstanceStuckDeleting
        exp_alerts: []
      - eval_time: 85m
        alertname: GarmInstanceStuckDeleting
        exp_alerts: []

  # Edge case for `garm:pool_slots_free`: an owner whose pools hold NO
  # instances at all has no `garm_runner_status` series, so the subtraction
  # would yield an empty vector rather than "all slots free". The `or
  # (… * 0)` arm in the recording rule is what keeps the series present, and
  # this asserts it — without it a fully-idle owner silently disappears from
  # the capacity view, which is exactly the kind of blind spot this family of
  # rules exists to remove.
  - interval: 1m
    name: 'an owner with pools and zero instances reports all slots free, not an empty vector'
    input_series:
      - series: 'garm_pool_max_runners{id="pool-z", instance="high-mem-server:9997", job="garm"}'
        values: '3x20'
      - series: 'garm_pool_info{id="pool-z", pool_owner="blocksense-network", instance="high-mem-server:9997", job="garm"}'
        values: '1x20'
    promql_expr_test:
      - expr: garm:pool_slots_allocated
        eval_time: 10m
        exp_samples: []
      - expr: garm:pool_slots_free
        eval_time: 10m
        exp_samples:
          - labels: '{__name__="garm:pool_slots_free", pool_owner="blocksense-network"}'
            value: 3
    alert_rule_test:
      - eval_time: 10m
        alertname: GarmCapabilityPoolStarvation
        exp_alerts: []

