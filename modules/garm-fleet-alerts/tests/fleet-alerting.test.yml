            exp_annotations:
              summary: 'GARM collapsed:9997 has fewer live runners than its min-idle floor'
              description: 'GARM at collapsed:9997 has had at most 2 runner(s) in state `running` for 15m+, fewer than the min-idle runners its enabled pools and scale sets declare. The controller is up, so runners are failing to be created or are dying. Check GarmProviderCreateFailures, the provider serve units (gosti-serve) and incus on the runner hosts, and the garm.service journal for `failed to create instance in provider`.'
          - exp_labels:
              severity: critical
              component: garm-fleet
              instance: empty:9997
            exp_annotations:
              summary: 'GARM empty:9997 has fewer live runners than its min-idle floor'
              description: 'GARM at empty:9997 has had at most 0 runner(s) in state `running` for 15m+, fewer than the min-idle runners its enabled pools and scale sets declare. The controller is up, so runners are failing to be created or are dying. Check GarmProviderCreateFailures, the provider serve units (gosti-serve) and incus on the runner hosts, and the garm.service journal for `failed to create instance in provider`.'

  # The same incident read through the 2026-10-31 artifact: both instance
  # records are missing from every third scrape. Read raw, allocation fell to
  # nothing on those scrapes, free rose to 2 and the 15m `for` restarted, so
  # this never paged. garm:pool_slots_free takes the max over 3m.
  - interval: 1m
    name: 'capability-pool starvation still pages when the runner family blinks out of some scrapes'
    input_series:
      # Two pools, 1 slot each => 2 declared slots for agent-harbor.
      - series: 'garm_pool_max_runners{id="pool-a", instance="high-mem-server:9997", job="garm"}'
        values: '1x40'
      - series: 'garm_pool_max_runners{id="pool-b", instance="high-mem-server:9997", job="garm"}'
        values: '1x40'
      - series: 'garm_pool_info{id="pool-a", pool_owner="agent-harbor", instance="high-mem-server:9997", job="garm"}'
        values: '1x40'
      - series: 'garm_pool_info{id="pool-b", pool_owner="agent-harbor", instance="high-mem-server:9997", job="garm"}'
        values: '1x40'
      # Both slots allocated: one live, one a pending_delete corpse.
      - series: 'garm_runner_status{name="garm-live", pool_id="pool-a", pool_owner="agent-harbor", provider="hms-incus", status="running", runner_status="active", instance="high-mem-server:9997", job="garm"}'
        values: '1 1 stale 1 1 stale 1 1 stale 1 1 stale 1 1 stale 1 1 stale 1 1 stale 1 1 stale 1 1 stale 1 1 stale 1 1 stale 1 1 stale 1 1 stale 1 1'
      - series: 'garm_runner_status{name="garm-corpse", pool_id="pool-b", pool_owner="agent-harbor", provider="hms-incus", status="pending_delete", runner_status="terminated", instance="high-mem-server:9997", job="garm"}'
        values: '1 1 stale 1 1 stale 1 1 stale 1 1 stale 1 1 stale 1 1 stale 1 1 stale 1 1 stale 1 1 stale 1 1 stale 1 1 stale 1 1 stale 1 1 stale 1 1'
      # Demand on a CAPABILITY class — the shape garm:class_saturated misses.
      - series: 'garm_job_status{status="queued", owner="agent-harbor", requested_labels="self-hosted linux x64", job_id="1", instance="high-mem-server:9997", job="garm"}'
        values: '1x40'
      - series: 'garm_job_status{status="queued", owner="agent-harbor", requested_labels="self-hosted linux x64", job_id="2", instance="high-mem-server:9997", job="garm"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: GarmCapabilityPoolStarvation
        exp_alerts: []
      - eval_time: 20m
        alertname: GarmCapabilityPoolStarvation
        exp_alerts:
          - exp_labels:
              severity: critical
              component: garm-fleet
              garm_owner: agent-harbor
            exp_annotations:
              summary: 'Runner STARVATION (capability pools): agent-harbor has 2 job(s) queued and ZERO free pool slots'
              description: '2 job(s) have been queued for 15m for owner agent-harbor while every declared capability-pool slot it owns is allocated. This is the pool-side counterpart of GarmFleetStarvation, which only covers scale-set classes and cannot see this. Allocation counts instances in `pending_delete`/`deleting` too, because GARM charges those against maxRunners until the record disappears — so check GarmInstanceStuckDeleting FIRST: if corpses are holding the slots, the fix is teardown, not more capacity. Raising maxRunners on a host that cannot tear down makes it worse.'
