# Prepared upstream PR bundle, driven by metacraft-dev-guidelines
# scripts/submit-prepared-pr; the process is described in
# metacraft-dev-guidelines policies/preparing-prs-for-internal-review.md.
#
# fix.patch was generated against upstream main c58e7375 (2026-09-29) and
# re-cut on aa830b59 (2026-10-23; the test now passes a context to
# InitController(), which upstream bf79e351 added). The local Nix patch
# (packages/garm/patches/fix-busy-runner-reap.patch) is the same change on our
# older pin, cut on top of our other local patches (it differs only in
# context).
#
# Build + test sanity on the PR tree (needs a Go toolchain with cgo):
#   go build ./...
#   go test -tags testing ./runner/pool/ -run TestBusyRunnerReapSuite

[upstream]
repo = "cloudbase/garm"
base_branch = "main"
base_sha = "aa830b59c762fb02671d41cd478704fa01ca0e9c"

[fork]
repo = "<your-gh-user>/garm" # pass --fork or FORK=

[pr]
branch = "fix-busy-runner-reap"
title = "Never reap a runner the forge reports busy"
body = "PR.md"
patches = ["fix.patch"]

[review]
# Private identifiers that must never reach the upstream PR.
forbid = [
  'high-mem-server',
  'gpu-server',
  'codetracer-ci',
  'hms-libvirt',
  '100\.83\.',
  '/var/lib/garm',
  'zroot',
  'checks/t_garm',
  'reprobuild-specs',
]
